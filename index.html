const SRS_HTML="<h2 id=\"s1\">Driver &amp; Dispatch Platform – Phase 1 SRS &amp; Proposal</h2><p><time>2026-11-04</time> · <span class=\"who\">Abdullah Mansour</span></p><h3 id=\"s2\">1. Introduction</h3><p>Phase 1 delivers an Android driver app and a web app for coordinators and drivers' supervisors, integrated with the existing fleet management system (FMS), in one build month followed by one testing and stabilization month.</p><h4 id=\"s3\">1.1 Purpose</h4><p>This document is the Software Requirements Specification (SRS) and commercial proposal for Phase 1 of the Driver &amp; Dispatch Platform (working name: ROMS App, until the client chooses a product name from section 12.2). It defines what will be built, how it connects to the current FMS, how it is delivered and tested, and on what commercial terms.</p><h4 id=\"s4\">1.2 Scope of Phase 1</h4><p>In scope:</p><ul class=\"bullet\"><li>Android driver app, distributed as an APK in Phase 1; publishing on Google Play is done later, when the client decides, and needs no new development</li><li>Web app for coordinators and drivers' supervisors</li><li>Admin dashboard for system administrators</li><li>Backend services, database and notifications, hosted on the client's own accounts</li><li>Integration with the current FMS through APIs: drivers, vehicles, trips, waybills</li><li>Route templates, steps and standard times per leg read from the FMS; points, KPI and ranking engine with loyalty rewards</li><li>Phase 1 AI features (section 6)</li></ul><p>Out of scope for Phase 1: iOS release, payroll or incentive payment calculation, the maintenance work-order module, customer-facing shipment tracking, and any telematics hardware. No GPS devices are installed on the trucks; positions come from the driver's phone. Also out of scope: a driver profile screen in the app, broadcast messages to drivers, report exports beyond the ranking Excel, and any AI feature not listed in section 6 (RFR triage, daily brief, coaching nudges, delay prediction, lesson generator). Handled outside the platform in Phase 1 and therefore not built: the RFR inbox and resolution, approvals of loyalty redemptions, manual point changes, and lesson content or quizzes; these stay in the FMS and in the client's training process, and the platform only sends requests and shows their status.</p><h4 id=\"s5\">1.3 Definitions</h4><div class=\"tbl-wrap\"><table class=\"tbl doc\"><tbody><tr><th>Term</th><th>Meaning</th></tr><tr><td>FMS</td><td>The client's current fleet management system: the source of trucks, drivers and planned trips</td></tr><tr><td>Trip</td><td>One assignment from loading to delivery. Created when a coordinator dispatches it or when a driver uploads a waybill</td></tr><tr><td>Waybill (\"policy\", بوليصة)</td><td>The shipping document the driver photographs to open a trip or to close its first step</td></tr><tr><td>RFR</td><td>A request raised by a driver for a problem that stops or slows work (repair, document, payment, route). Raised in the app, handled and closed in the FMS; the closing status comes back to the app and notifies the driver</td></tr><tr><td>Coordinator</td><td>Dispatcher who distributes trips to drivers and answers their calls</td></tr><tr><td>Drivers' supervisor</td><td>Monitors drivers in the web app: driver files, training progress, alerts and ranking. Handles RFRs and approvals in the FMS, not in the platform</td></tr><tr><td>Step</td><td>A stage inside a trip, for example arrived at loading, loaded, departed, arrived at destination, unloaded. Each step requires a document or photo</td></tr><tr><td>Leg</td><td>The segment between two consecutive steps of a trip. A trip has as many legs as its route template defines</td></tr><tr><td>Standard time</td><td>The time allowed for a leg, as defined in the FMS route template. Actual leg time is measured against it</td></tr><tr><td>KPI</td><td>A measured driver performance indicator, for example driving time, payload, legs within standard time</td></tr><tr><td>Points</td><td>Score earned from KPIs and coordinator evaluation, used for ranking and loyalty rewards</td></tr></tbody></table></div><h4 id=\"s6\">1.4 Requirement notation</h4><p>Every requirement has an ID made of three parts: a type, an area and a number, for example FR-DRV-08 is the eighth functional requirement of the driver app. The prototype shows these IDs on every screen, so each screen traces back to a line in this document.</p><div class=\"tbl-wrap\"><table class=\"tbl doc\"><tbody><tr><th>Part</th><th>Code</th><th>Meaning</th></tr><tr><td>Type</td><td>FR</td><td>Functional requirement: something the system does</td></tr><tr><td>Type</td><td>NFR</td><td>Non-functional requirement: a quality the system must meet, such as performance, security or offline work</td></tr><tr><td>Type</td><td>IF</td><td>Interface: a data exchange with the FMS or another system</td></tr><tr><td>Area</td><td>DRV</td><td>Driver app</td></tr><tr><td>Area</td><td>WEB</td><td>Web app for coordinator, supervisor and manager</td></tr><tr><td>Area</td><td>ADM</td><td>Admin dashboard</td></tr><tr><td>Area</td><td>AI</td><td>AI features (section 6)</td></tr><tr><td>Number</td><td>01, 02, …</td><td>Sequence inside the area. A missing number is an item removed from scope before signing</td></tr></tbody></table></div><p>Every requirement in this document is in scope for Phase 1 and covered by the fixed price. Anything not written here is out of scope and is quoted separately.</p><h3 id=\"s7\">2. Overall description</h3><p>Five roles use the platform. Drivers work only in the app; everyone else works in the web app.</p><h4 id=\"s8\">2.1 Users and roles</h4><div class=\"tbl-wrap\"><table class=\"tbl doc\"><tbody><tr><th>Role</th><th>Where</th><th>What they do</th></tr><tr><td>Driver</td><td>Android app</td><td>Logs in, receives trips, follows trip steps and uploads the document for each, raises RFRs, calls the coordinator, sees income, KPIs, points, ranking and training</td></tr><tr><td>Coordinator</td><td>Web app</td><td>Distributes trips, monitors live progress, answers driver calls, evaluates drivers (the \"weight\" that feeds KPIs)</td></tr><tr><td>Drivers' supervisor</td><td>Web app</td><td>Monitors driver files, training progress, alerts and ranking. Requests and approvals are handled in the FMS</td></tr><tr><td>Operations manager</td><td>Web app</td><td>Reads dashboards: fleet KPIs, ranking, delays, training progress, open RFRs and their age as reported by the FMS</td></tr><tr><td>Administrator</td><td>Admin dashboard</td><td>Manages users, roles, trucks, routes, point rules and integration health</td></tr></tbody></table></div><h4 id=\"s9\">2.2 How work flows today</h4><ul class=\"bullet\"><li>The coordinator distributes trips; the driver hears or reads the trip details, today by phone and chat.</li><li>A trip exists once the coordinator dispatches it or the driver uploads the waybill.</li><li>When a driver has a problem, the drivers' supervisor writes it down as an RFR. Closing the RFR sends the driver a notification and the driver continues. If the problem is not solved the driver escalates again.</li><li>Nothing of this is recorded against the driver in a way that feeds KPIs, income visibility or ranking.</li></ul><h4 id=\"s10\">2.3 Flow in the platform</h4><figure class=\"fig\" data-fig=\"flow\"><figcaption>trip and RFR flow · two ways to open a trip, one loop until the problem is solved</figcaption></figure><p>A trip opens either from the coordinator's dispatch or from the driver's waybill upload, which opens the trip at once and shows it on the coordinator's board as opened by the driver. Steps carry the trip to close. A problem on the way becomes an RFR that the app sends to the FMS (IF-06), where the supervisor resolves it; the status comes back to the app; the driver confirms it is solved or escalates again.</p><h4 id=\"s11\">2.4 Assumptions and dependencies</h4><ul class=\"bullet\"><li>The FMS exposes APIs, or at minimum read access, for drivers, vehicles and trips. Documentation and a test environment are available at kickoff.</li><li>Drivers carry Android phones. Connectivity on sites and roads is intermittent, so trip steps and uploads work offline and sync later. The phone is also the GPS source: the app records positions in the background during a trip.</li><li>User accounts and roles for every user, drivers and web users alike, come from the FMS: people sign in with their FMS credentials, checked through the FMS (IF-12), and no accounts are created in the platform. Firebase on the client's own Google account is used only for push notifications. Photos and voice notes are stored on the client's server. The backend runs on the client's servers.</li><li>The driver app is Arabic first. The web app is Arabic and English.</li><li>The client names one product owner who is available for a weekly review and for decisions within two working days.</li></ul><h3 id=\"s12\">3. Functional requirements: driver app</h3><p>The driver app covers the whole working day: receive a trip, execute it step by step with a document at each step, report problems, and see what the day earned in money, KPIs and points. Driving time is the central measure.</p><div class=\"tbl-wrap\"><table class=\"tbl doc\"><tbody><tr><th>ID</th><th>Requirement</th></tr><tr><td>FR-DRV-01</td><td>Sign in with the driver's FMS username or email and password, checked against the FMS (IF-12); no separate account and no password reset in the app, both stay in the FMS. The device is bound to the driver on first sign-in; a 4-digit PIN reopens the app quickly</td></tr><tr><td>FR-DRV-02</td><td>My trips: today's and upcoming trips with origin, destination, cargo, planned payload, truck and waybill number</td></tr><tr><td>FR-DRV-03</td><td>Read and listen: every trip card has a play button that reads the trip details aloud in Arabic, for drivers who prefer not to read while working</td></tr><tr><td>FR-DRV-04</td><td>Start trip and follow ordered steps: arrived at loading, loaded, departed, arrived at destination, unloaded, closed. The steps and their order come from the trip's FMS route template, and each step is stamped with time and GPS position</td></tr><tr><td>FR-DRV-05</td><td>Every step requires its document: waybill, loading ticket, weighbridge ticket, delivery receipt or proof of delivery, taken with the camera. A step cannot close without it</td></tr><tr><td>FR-DRV-06</td><td>Create a trip by uploading the waybill when no dispatch exists: the AI reads the waybill (FR-AI-03), the driver checks the fields, and the trip opens at once, marked as opened by the driver. It appears on the coordinator's board and is written to the FMS (IF-05); the coordinator can correct route or payload from the trip record. No approval step</td></tr><tr><td>FR-DRV-07</td><td>Offline first: steps, photos and RFRs are queued on the phone and sync when the network returns; the driver sees what is still pending upload</td></tr><tr><td>FR-DRV-08</td><td>Raise an RFR: category, text or voice note, photo and location. Track its status as reported by the FMS (IF-06), receive the closing notification, confirm solved or escalate again with one tap</td></tr><tr><td>FR-DRV-09</td><td>Call the coordinator with one tap from the trip; the call is logged against the trip</td></tr><tr><td>FR-DRV-10</td><td>History: all past trips with their steps, documents, payloads and RFRs, filterable by date and route</td></tr><tr><td>FR-DRV-11</td><td>Income: earnings per trip and per period, with bonuses and deductions, shown from the rules or from the FMS/HR figures. Display only; the calculation of pay stays in the client's systems</td></tr><tr><td>FR-DRV-12</td><td>My KPIs: the client's existing KPI results read from the FMS (IF-11), plus the platform's own measures (legs within standard time, break compliance, speed and GPS alerts, documents), each against its target for the day, week and month</td></tr><tr><td>FR-DRV-13</td><td>Points and ranking: points balance, how each point was earned, rank among drivers on the same site and across the fleet, badges</td></tr><tr><td>FR-DRV-14</td><td>Loyalty: a rewards catalogue the client defines (fuel vouchers, days off, cash bonus, priority on good routes); the driver requests a redemption; the request goes to the FMS (IF-06), is approved there, and the app shows its status</td></tr><tr><td>FR-DRV-15</td><td>Alerts: GPS switched off, speed above the limit, driving time above the daily threshold, break overdue. Shown in the app and logged for the KPI engine</td></tr><tr><td>FR-DRV-16</td><td>Break time: start and end a break; break minutes are excluded from driving time and checked against the rest rule</td></tr><tr><td>FR-DRV-17</td><td>Notifications: new trip, trip changed or cancelled, RFR update, points earned, document missing, upcoming course reminder</td></tr><tr><td>FR-DRV-18</td><td>Training record: completed courses with dates and results, progress against the required plan, and the next scheduled course with date, time and place, with a reminder notification the day before. Course data comes from the client's training records (IF-10). No lessons, quizzes or digital courses are delivered in the app</td></tr><tr><td>FR-DRV-19</td><td>AI assistant inside the app (section 6): ask about my trip, my points, what to do at a step, and dictate an RFR by voice</td></tr><tr><td>FR-DRV-21</td><td>Arabic right-to-left interface, large tap targets usable with one hand in a truck cabin, dark mode for night driving</td></tr><tr><td>FR-DRV-22</td><td>Background GPS tracking: while a trip is running the app records position and speed every 30 to 60 seconds, buffers them offline, and shows the driver that tracking is on. GPS switched off or the app closed during a trip is recorded as a gap and raises an alert</td></tr><tr><td>FR-DRV-23</td><td>Leg timer: for the current leg the driver sees the standard time from the FMS template, the time used and the margin left. When the margin runs out the app asks for a delay reason (traffic, queue, breakdown, other) that the coordinator sees at once</td></tr></tbody></table></div><h3 id=\"s13\">4. Functional requirements: web app and admin dashboard</h3><p>The web app is where trips are created and distributed, drivers are watched live, and driver files, training progress and ranking are monitored, on the same records the driver sees in the app. Requests and approvals are handled in the FMS, not in the web app.</p><h4 id=\"s14\">4.1 Coordinator</h4><div class=\"tbl-wrap\"><table class=\"tbl doc\"><tbody><tr><th>ID</th><th>Requirement</th></tr><tr><td>FR-WEB-01</td><td>Trip board: create trips by hand or pull the day's plan from the FMS, assign driver and truck, reassign by drag, distribute a whole day in one action</td></tr><tr><td>FR-WEB-02</td><td>Live view: a map and a list with each truck's position as reported by the driver app, the current step and leg of each trip with actual against standard time, and delays highlighted</td></tr><tr><td>FR-WEB-04</td><td>Calls and notes: see calls received from drivers per trip, add notes, see the RFRs raised on the trip with their FMS status (read only)</td></tr><tr><td>FR-WEB-05</td><td>Driver evaluation: rate each driver weekly on defined criteria (cooperation, care of the truck, response to instructions). The rating becomes the coordinator weight in section 5</td></tr></tbody></table></div><h4 id=\"s15\">4.2 Drivers' supervisor (monitoring)</h4><div class=\"tbl-wrap\"><table class=\"tbl doc\"><tbody><tr><th>ID</th><th>Requirement</th></tr><tr><td>FR-WEB-08</td><td>Driver file: one page per driver with KPIs, points, alerts, RFR status from the FMS, training progress with the next course, and document expiry dates</td></tr></tbody></table></div><h4 id=\"s16\">4.3 Management views</h4><div class=\"tbl-wrap\"><table class=\"tbl doc\"><tbody><tr><th>ID</th><th>Requirement</th></tr><tr><td>FR-WEB-10</td><td>Dashboard: trips today, on-time percentage, driving hours, tons moved, open RFRs by age as reported by the FMS, alerts count, training completion, top and bottom drivers</td></tr><tr><td>FR-WEB-11</td><td>Ranking page by site and fleet with period filter and Excel export</td></tr><tr><td>FR-WEB-13</td><td>Arabic and English interface, usable on a tablet</td></tr></tbody></table></div><h4 id=\"s17\">4.4 Admin dashboard</h4><div class=\"tbl-wrap\"><table class=\"tbl doc\"><tbody><tr><th>ID</th><th>Requirement</th></tr><tr><td>FR-ADM-01</td><td>Users and roles are read from the FMS (IF-01, IF-12) and shown here; the administrator maps each FMS role to the platform's permissions, manages sites and sees which FMS record each user is linked to. No user is created or given a password in the platform</td></tr><tr><td>FR-ADM-02</td><td>Point rules editor: which KPIs count (from the FMS or from the platform), their weights, targets, thresholds, penalties and the coordinator weight range, with a preview of the effect on last week's data. Shipped with the recommended model of section 5 as defaults</td></tr><tr><td>FR-ADM-03</td><td>Integration health: last successful sync per FMS feed, failed records with the reason, retry button</td></tr><tr><td>FR-ADM-04</td><td>Audit log of every change to points, rules, trips and user roles</td></tr><tr><td>FR-ADM-05</td><td>Content management: rewards catalogue and notification templates in Arabic and English; CSV import of training records and the course schedule where IF-10 does not exist</td></tr><tr><td>FR-ADM-06</td><td>Route templates from the FMS: view the ordered steps and the standard time per leg as received from the FMS (IF-09), with the version in force. The tolerance per leg and the required document type per step are set in the platform where the FMS does not carry them</td></tr></tbody></table></div><h3 id=\"s18\">5. Points, KPIs and ranking (recommended model)</h3><p>The client already calculates driver KPIs. The platform does not replace that calculation: it reads the KPI results from the FMS (IF-11) and shows them to the driver and in the web app, and it adds only the measures the FMS cannot have because they come from the phone: leg time against the route standard, GPS and speed alerts, breaks and documents. The points, ranking and loyalty engine runs on top of these values with weights the administrator sets (FR-ADM-02). Everything in this section is therefore a recommendation, not a requirement: the model below is our proposed starting point, to be aligned with the client's existing KPI definitions in week 1. The engine itself, the screens and the interface are in scope; the exact weights and targets are the client's decision.</p><h4 id=\"s19\">5.1 KPIs</h4><div class=\"tbl-wrap\"><table class=\"tbl doc\"><tbody><tr><th>KPI</th><th>Measure</th><th>Data source</th><th>Example target</th><th>Example points per day</th></tr><tr><td>Driving time</td><td>Productive driving hours inside the legal limit; hours above the daily maximum score negative</td><td>App GPS track, trip steps, break records</td><td>8 h, maximum 10 h</td><td>up to 40</td></tr><tr><td>Payload</td><td>Tons delivered against tons planned</td><td>Waybill and weighbridge ticket</td><td>at least 95% of plan</td><td>up to 20</td></tr><tr><td>Leg time against standard</td><td>Legs completed within their FMS standard time plus tolerance; the whole trip against its total standard is reported beside it</td><td>Trip steps</td><td>at least 90%</td><td>up to 20</td></tr><tr><td>Safety</td><td>Speed alerts, GPS switched off or app closed during a trip, harsh braking from the phone sensors where reliable</td><td>App GPS track</td><td>0 alerts</td><td>up to 20, minus 5 per alert</td></tr><tr><td>Break compliance</td><td>Breaks taken according to the rest rule</td><td>App break records</td><td>per rule</td><td>plus or minus 5</td></tr><tr><td>Documents</td><td>All step documents uploaded the same day</td><td>App uploads</td><td>100%</td><td>plus 5</td></tr></tbody></table></div><h4 id=\"s20\">5.2 Legs and standard times</h4><p>Every route has a template of ordered steps with a standard time for each step-to-step leg. These templates already exist in the FMS and are read from it (IF-09), so nothing is retyped: for example gate to loading bay 20 minutes, loading 45 minutes, Sokhna to Ataqa 2 hours 30 minutes. The platform measures the actual time of every leg from the step timestamps, with arrival detected from the GPS track where a geofence exists, and compares it with the standard.</p><ul class=\"bullet\"><li>Every leg gets a status: within standard, within tolerance, or over. Over asks the driver for a delay reason and highlights the trip for the coordinator.</li><li>The leg KPI counts the share of legs within standard. The trip total against its total standard is shown beside it, so a driver who loses time on one leg and recovers it on another is judged fairly.</li><li>Waiting legs outside the driver's control, such as a queue at the weighbridge or waiting for a loader, are marked by the coordinator and excluded from the driver's score, but kept in the site report.</li><li>A weekly report lists legs that run over on most trips, so the standard or the route is corrected in the FMS rather than the driver.</li><li>Each FMS template version is kept, so a past trip is always judged against the standard that applied on its date.</li></ul><h4 id=\"s21\">5.3 Coordinator weight</h4><p>The coordinator rates each driver once a week from 1 to 5 on cooperation, care of the truck and response to instructions. The average becomes a multiplier between 0.9 and 1.1 on that week's points. The range is capped so that a rating can adjust a score but never replace the measured KPIs. Every rating is logged and visible to the supervisor.</p><h4 id=\"s22\">5.4 Score</h4><div class=\"formula\"><b>Week points</b> = ( Σ<sub>days</sub> Σ<sub>KPIs</sub> points ) × coordinator weight</div><p>Monthly ranking orders drivers by the sum of their week points. The loyalty balance is the cumulative points minus points redeemed, and it carries over from month to month.</p><h4 id=\"s23\">5.5 Ranking and tiers</h4><ul class=\"bullet\"><li>Two leaderboards: per site and across the fleet, each with a monthly reset.</li><li>Tiers Bronze, Silver and Gold from the three-month average, shown as a badge in the app and in the driver file.</li><li>Ties break on the safety KPI, so a safe driver always ranks above an unsafe one with the same total.</li></ul><h4 id=\"s24\">5.6 Keeping it fair</h4><ul class=\"bullet\"><li>Positions come from the driver's phone, so a switched-off GPS or a closed app during a trip is recorded as a gap: the gap earns no driving time, counts as a safety alert and is shown to the supervisor. Mock-location apps are detected and the trip is flagged.</li><li>Step times are recorded on the server when the step syncs, with the phone time kept beside it.</li><li>A step without its document does not count as on time.</li><li>There are no manual point changes in Phase 1: points come only from the KPI engine, the coordinator weight and the waiting-leg exclusion, all of which are logged.</li></ul><h3 id=\"s25\">6. AI features</h3><p>AI is used where it removes typing or reading for a driver in a cabin, and where it saves a coordinator from scanning raw data. Phase 1 ships exactly these four features; any other AI feature is out of scope and quoted separately. All calls run through the Claude API on the client's own account, with Arabic as the working language.</p><div class=\"tbl-wrap\"><table class=\"tbl doc\"><tbody><tr><th>ID</th><th>Feature</th><th>Who</th><th>What it does</th></tr><tr><td>FR-AI-01</td><td>Voice RFR</td><td>Driver</td><td>The driver holds a button and describes the problem in Egyptian Arabic. The app transcribes it, picks the category, writes a clean summary that is sent with the request to the FMS, and keeps the original audio</td></tr><tr><td>FR-AI-02</td><td>Trip read-aloud and Q&amp;A</td><td>Driver</td><td>Natural Arabic reading of trip details, and short answers to questions such as \"what do I need at the weighbridge?\" or \"how many points did I get yesterday?\", answered only from the driver's own data</td></tr><tr><td>FR-AI-03</td><td>Document check</td><td>Driver, coordinator</td><td>When a waybill or ticket photo is uploaded, the model reads the key fields (waybill number, tons, date, destination) and flags a blurry photo or a mismatch with the trip before the step closes</td></tr><tr><td>FR-AI-04</td><td>Ask operations</td><td>Coordinator, manager</td><td>A chat box over the live data: \"which trucks are late to Sokhna?\", \"who had the most alerts this week?\". Answers come from queries over the platform's data, with the numbers shown beside the text</td></tr></tbody></table></div><p>Guardrails: the model never changes points, closes an RFR or edits a trip on its own; it drafts and a person confirms. Every AI answer shows the records it used. Audio and photos stay in the client's storage and are not used for model training.</p><h4 id=\"s26\">6.1 Keeping AI usage cheap</h4><p>The AI service is a router, not a pass-through to the model. It applies these rules on every request, and the resulting cost estimate is in section 10.5.</p><ul class=\"bullet\"><li><strong>Database first.</strong> The assistant recognises the common questions (my income, my next trip, my points, my ranking, my next course, what to do at this step) and answers them from the platform's own records with a fixed Arabic template. No model is called. This is expected to cover most of the traffic.</li><li><strong>Small model by default.</strong> Open questions and document checks (FR-AI-03) run on the small Claude model. The larger model is used only to structure a voice RFR (FR-AI-01) and for questions the router marks as complex.</li><li><strong>Short calls.</strong> A cached system prompt under 800 tokens, only the records the question needs, answers capped at about 120 words, and only the last two turns of a chat are resent.</li><li><strong>Hard limits in the backend.</strong> 20 assistant messages per user per day, 6 turns per conversation, and a monthly spend cap on the client's Claude account. When a limit is reached the user sees a clear message, not an error.</li><li><strong>Visible cost.</strong> Every call is logged with its tokens and cost per user and per feature, shown on the admin health page, so the client sees the real figure after the first month and the limits can be adjusted.</li></ul><h3 id=\"s27\">7. Integration with the current FMS</h3><p>The FMS stays the system of record for trucks, drivers and planned trips; GPS positions originate in the driver app. The platform reads from it, writes back trip events and RFRs, and never duplicates data entry. The exact API shape is confirmed in the discovery week; the table lists what is needed and the fallback if an interface does not exist.</p><div class=\"tbl-wrap\"><table class=\"tbl doc\"><tbody><tr><th>ID</th><th>Data</th><th>Direction</th><th>Frequency</th><th>Used for</th><th>Fallback if no API</th></tr><tr><td>IF-01</td><td>Drivers (id, name, licence, assigned truck, status)</td><td>FMS to platform</td><td>Nightly sync, plus on demand</td><td>User accounts, driver file</td><td>CSV import in the admin dashboard</td></tr><tr><td>IF-02</td><td>Vehicles (plate, type, capacity, status)</td><td>FMS to platform</td><td>Nightly</td><td>Trip assignment, payload target</td><td>CSV import</td></tr><tr><td>IF-03</td><td>Trips or orders planned in the FMS</td><td>FMS to platform</td><td>Every 5 minutes</td><td>Trip board, driver's trip list</td><td>Coordinator creates trips in the web app</td></tr><tr><td>IF-04</td><td>GPS positions and speed from the driver app</td><td>Platform to FMS, optional</td><td>Every 30 to 60 seconds while a trip is running</td><td>Live map, driving time, speed and GPS-off alerts; live positions for the FMS if it wants them</td><td>Not needed; the app is the source</td></tr><tr><td>IF-05</td><td>Trip events: step times, documents, actual payload, close</td><td>Platform to FMS</td><td>On each step</td><td>Keeps the FMS trip record complete</td><td>Daily export file</td></tr><tr><td>IF-06</td><td>RFRs and loyalty requests, and their status</td><td>Both ways: platform to FMS on create and escalation, FMS to platform on status change and close</td><td>On each change</td><td>Requests are handled in the FMS; the app shows status, the closing notification and the loyalty approval</td><td>Daily export of new requests; status entered by CSV import in the admin dashboard</td></tr><tr><td>IF-07</td><td>Earnings per trip or per period</td><td>FMS or HR to platform</td><td>Daily</td><td>Driver income screen</td><td>Rule-based estimate shown as indicative</td></tr><tr><td>IF-08</td><td>Weighbridge tickets, where a weighbridge system exists</td><td>Weighbridge to platform</td><td>On ticket</td><td>Payload KPI without typing</td><td>Photo of the ticket read by FR-AI-03</td></tr><tr><td>IF-09</td><td>Route templates: ordered steps per route and the standard time per leg</td><td>FMS to platform</td><td>Nightly, plus on demand</td><td>Leg timer in the app, leg KPI, live view</td><td>None: this data is maintained in the FMS</td></tr><tr><td>IF-10</td><td>Training records and course schedule (completed courses, results, next course date, time and place)</td><td>HR or training system to platform</td><td>Daily</td><td>Driver training progress and course reminder; training progress in the web app</td><td>CSV import in the admin dashboard</td></tr><tr><td>IF-11</td><td>KPI results per driver from the client's existing calculation (daily values and targets)</td><td>FMS to platform</td><td>Daily</td><td>Driver KPI screen, driver file, points engine</td><td>The platform computes the KPIs of section 5 from its own data</td></tr><tr><td>IF-12</td><td>User accounts and roles for all users (drivers, coordinators, supervisors, managers, administrators) and the sign-in check</td><td>FMS to platform</td><td>Users nightly; sign-in check on each login</td><td>Sign-in for the app and the web app, role-based menus, no accounts in the platform</td><td>User list by CSV import; if the FMS has no sign-in API, the platform verifies passwords against a copy it never displays</td></tr></tbody></table></div><h4 id=\"s28\">7.1 Integration rules</h4><ul class=\"bullet\"><li>Each FMS record keeps its FMS id in the platform, so nothing is matched by name.</li><li>Every sync is logged with counts and failures and shown in the admin integration health page (FR-ADM-03).</li><li>Writes to the FMS are idempotent: the same step event sent twice updates one record.</li><li>Credentials for the FMS live in the client's secret store, never in the app.</li><li>If the FMS is unavailable the platform keeps working on its last copy and queues outgoing events.</li></ul><h4 id=\"s29\">7.2 What is needed from the client by kickoff</h4><ul class=\"bullet\"><li>API documentation for the FMS, or a named contact at the FMS vendor.</li><li>A test environment or a read-only database account for the discovery week.</li><li>Confirmation of which of IF-01 to IF-12 exist today, and the definitions of the client's existing KPIs, so the fallbacks can be decided in week 1.</li></ul><h3 id=\"s30\">8. Architecture, environments and non-functional requirements</h3><p>Everything runs on accounts the client owns from day one: the Firebase project, the server, the database, the Claude API key, the store account and the source repository. Nothing is migrated or handed over at the end: the client's IT team is oriented on a system it already owns.</p><h4 id=\"s31\">8.1 Components</h4><figure class=\"fig\" data-fig=\"arch\"><figcaption>system architecture · two apps, one backend on the client server, three external services</figcaption></figure><p>Both apps call one backend API. Inside the client server, sync workers exchange data with the FMS, the AI layer calls the Claude API, and everything is stored in PostgreSQL with photos and voice notes in the server's file storage. Sign-in is checked against the FMS; Firebase is used for push notifications only.</p><ul class=\"bullet\"><li>Driver app: cross-platform code base (Flutter), shipped for Android in Phase 1 so that iOS in a later phase is a build, not a rewrite.</li><li>Web app: React single-page app serving coordinators, supervisors, managers and the admin dashboard, with role-based menus.</li><li>Backend API: Node.js (NestJS) on the client's server, PostgreSQL database, background workers for FMS sync, the points engine and notifications.</li><li>Firebase: push notifications only (Cloud Messaging), on the client's Google account. File storage: photos and voice notes on the client's server with expiring links. Identity: FMS accounts and roles for every user.</li><li>AI service: a thin layer in the backend that calls the Claude API with the driver's or coordinator's own records as context, so the apps never hold the API key.</li></ul><h4 id=\"s32\">8.2 Environments and accounts</h4><div class=\"tbl-wrap\"><table class=\"tbl doc\"><tbody><tr><th>Item</th><th>Provided by</th><th>Set up in</th><th>Notes</th></tr><tr><td>Firebase project</td><td>Client (Google account)</td><td>Week 1</td><td>Cloud Messaging only (push notifications)</td></tr><tr><td>Server for backend and database</td><td>Client (cloud VM or on-premise)</td><td>Week 1</td><td>Two environments: UAT and production</td></tr><tr><td>Domain and SSL certificate</td><td>Client</td><td>Week 1</td><td>For the web app and API</td></tr><tr><td>Google Play developer account</td><td>Client</td><td>When needed</td><td>Not needed in Phase 1: the APK is distributed directly. Opened only when the client decides to publish on the store</td></tr><tr><td>Claude API account</td><td>Client</td><td>Week 3</td><td>Usage billed to the client; a monthly cap is set in the console</td></tr><tr><td>Source repository</td><td>Client (GitHub organization)</td><td>Week 1</td><td>All code committed here from the first day</td></tr><tr><td>Error tracking and logs</td><td>Client</td><td>Week 2</td><td>Open-source or free tier is enough for Phase 1</td></tr></tbody></table></div><h4 id=\"s33\">8.3 Non-functional requirements</h4><div class=\"tbl-wrap\"><table class=\"tbl doc\"><tbody><tr><th>ID</th><th>Requirement</th></tr><tr><td>NFR-01</td><td>Offline: trip steps, photos and RFRs work with no network and sync within 60 seconds of reconnecting</td></tr><tr><td>NFR-02</td><td>Performance: web pages open in under 2 seconds; the live view refreshes at least every 60 seconds; API responses under 500 ms for 95% of calls</td></tr><tr><td>NFR-03</td><td>Capacity: 500 drivers, 300 trucks and 2,000 trips per day with two years of history, to be confirmed with the client's real numbers</td></tr><tr><td>NFR-04</td><td>Security: role-based access with roles from the FMS, sign-in checked against the FMS (IF-12) with lockout after repeated failures, TLS everywhere, secrets kept on the server, photo links that expire, full audit log</td></tr><tr><td>NFR-05</td><td>Data stays in client-controlled accounts, in a region the client chooses</td></tr><tr><td>NFR-06</td><td>Availability: 99.5% monthly for the backend; the driver app keeps working offline during any outage</td></tr><tr><td>NFR-07</td><td>Battery and data: background tracking runs only during a trip with a visible notification, sampling adapts to movement, and a full shift is tested on a mid-range phone; photos are compressed to about 300 KB before upload</td></tr><tr><td>NFR-08</td><td>Localization: Arabic right-to-left by default in the app, Arabic and English on the web, all dates and numbers formatted per language</td></tr><tr><td>NFR-09</td><td>Observability: error tracking, structured logs and the integration health page</td></tr><tr><td>NFR-10</td><td>Backups: daily database backup with 30 days of retention; a restore is tested during month 2</td></tr><tr><td>NFR-11</td><td>Orientation: client-owned repository from day one, automated build, README, API documentation (OpenAPI) and a recorded orientation session for the client's IT team</td></tr></tbody></table></div><h3 id=\"s34\">9. Delivery plan</h3><p>Two months. The build month ends with the full Phase 1 scope on the client's UAT environment (milestone M1). The stabilization month ends with the pilot site live and the IT team oriented (milestone M2).</p><figure class=\"fig\" data-fig=\"plan\"><figcaption>eight-week plan · build in weeks 1 to 4, UAT and rollout in weeks 5 to 8</figcaption></figure><p>The build streams overlap so that the web app is ready while the driver app is still being finished; M1 and M2 are the two payment milestones after signing.</p><ol class=\"ordered\"><li>Week 1, discovery and setup: FMS API review, the client's existing KPI definitions aligned with the recommended model of section 5, final screen list, accounts and repository created, design system and Arabic copy agreed. Scope freeze at the end of the week.</li><li>Week 2, driver core: sign-in, trips, steps with documents, offline sync, backend and FMS read syncs (IF-01 to IF-04).</li><li>Week 3, web core: trip board, live view, RFR hand-off to the FMS and the status loop back to the driver, notifications, points engine.</li><li>Week 4, completion: KPIs, ranking, income, admin dashboard, AI features FR-AI-01 to FR-AI-04, internal QA. UAT build delivered: M1.</li><li>Weeks 5 and 6, UAT: a pilot group of about 10 drivers, 2 coordinators and 1 supervisor at one site. Daily fixes, FMS write-backs verified (IF-05, IF-06).</li><li>Week 7, rollout at the pilot site: training sessions for drivers, coordinators and supervisors, APK installed on the drivers' phones.</li><li>Week 8, stabilization and orientation: backup and restore test, documentation, recorded orientation session for the IT team, acceptance: M2.</li></ol><p>A weekly review with the product owner is held on the same day each week, and a short written status goes out every Thursday.</p><h3 id=\"s35\">10. Commercials and pricing</h3><p>Phase 1 is one fixed price for exactly the requirements in this document, paid in three milestones. Nothing outside this document is included.</p><h4 id=\"s36\">10.1 Price</h4><p>Fixed price for Phase 1, both months, covering every requirement in sections 3 to 8: USD 14,000 including VAT.</p><p>Prices are in US dollars; invoices can be issued in Egyptian pounds at the Central Bank rate on the invoice date.</p><h4 id=\"s37\">10.2 Payment schedule</h4><div class=\"tbl-wrap\"><table class=\"tbl doc\"><tbody><tr><th>Milestone</th><th>When</th><th>Share</th><th>Amount (USD)</th></tr><tr><td>Contract signed</td><td>Day 0</td><td>40%</td><td>5,600</td></tr><tr><td>M1: full scope delivered to UAT</td><td>End of week 4</td><td>40%</td><td>5,600</td></tr><tr><td>M2: acceptance and IT orientation</td><td>End of week 8</td><td>20%</td><td>2,800</td></tr></tbody></table></div><h4 id=\"s38\">10.3 Included</h4><ul class=\"bullet\"><li>Analysis, UI design, development, testing and deployment on the client's environments</li><li>Three training sessions: drivers, coordinators and supervisors, administrators</li><li>Twenty hours of small changes during month 2, beyond defect fixes</li><li>Documentation: README, API documentation, admin guide, short driver guide in Arabic</li><li>A recorded orientation session for the client's IT team on the code, deployment and operations</li></ul><h4 id=\"s39\">10.4 Paid by the client directly</h4><ul class=\"bullet\"><li>Servers, file storage, Firebase push usage, domain and SSL</li><li>Claude API usage, with a monthly cap set in the console (estimate in section 10.5)</li><li>Google Play developer account fee, only when the client decides to publish on the store; not needed in Phase 1</li><li>Any charges from the FMS vendor for API access</li><li>Phones or any hardware</li></ul><h4 id=\"s40\">10.5 Estimated AI usage cost</h4><p>The Claude API is billed to the client's own account by usage, not per user. With the controls in section 6.1 (database-first answers, the small model by default, short calls and hard limits), the estimate for 500 users over 22 working days is:</p><div class=\"tbl-wrap\"><table class=\"tbl doc\"><tbody><tr><th>Assistant use per person per day</th><th>Messages per month</th><th>Estimated cost per month (USD)</th></tr><tr><td>3 (the expected level after the first month)</td><td>33,000</td><td>10 to 20</td></tr><tr><td>10</td><td>110,000</td><td>35 to 50</td></tr><tr><td>20 (the hard cap)</td><td>220,000</td><td>70 to 100</td></tr></tbody></table></div><ul class=\"bullet\"><li>Document checks (FR-AI-03): about USD 5 per month at 300 trips a day with three photos each.</li><li>Voice RFRs (FR-AI-01): under USD 5 per month at a few hundred requests.</li><li>Working budget: USD 30 to 100 per month in total, with a USD 150 monthly cap set in the Claude console as a safety limit.</li><li>For comparison, the same traffic sent to the large model with full context on every message would cost USD 200 to 1,300 per month. The controls in section 6.1 are what keep it in the range above.</li><li>Figures use Anthropic's list prices at the date of this document. The real cost is read from the admin health page after the first month, and the limits are adjusted with the client.</li></ul><h4 id=\"s41\">10.6 After Phase 1</h4><ul class=\"bullet\"><li>Maintenance retainer: USD 2,000 per month for monitoring, fixes and up to 25 hours of improvements, cancellable with one month's notice</li></ul><p>This offer is valid for 30 days from the date above.</p><h3 id=\"s42\">11. Terms</h3><p>The client owns the code, the data and the accounts. The developer is protected by milestone payments and a frozen scope.</p><h4 id=\"s43\">11.1 Ownership</h4><ul class=\"bullet\"><li>All source code, designs, content and documentation produced for this project belong to the client.</li><li>Code is committed to the client's repository from the first day, so the client always holds the current version.</li><li>Ownership of each delivery transfers on receipt of the corresponding milestone payment.</li><li>The developer keeps no reuse rights over project code, only over generic open-source libraries and general know-how.</li></ul><h4 id=\"s44\">11.2 Scope control</h4><ul class=\"bullet\"><li>Scope is the Must requirements in this document, frozen at the end of week 1.</li><li>A defect is a Must requirement that does not work as written. Defects are fixed at no cost during the two months and for 30 days after M2 (the warranty period), within the limits below.</li><li>Anything else is a change request, agreed in writing, and either swapped against a requirement of equal effort or billed at USD 60 per hour.</li></ul><p><strong>Covered in the warranty period, at no cost</strong></p><ul class=\"bullet\"><li>A Must requirement that fails, crashes or gives a wrong result when used as described in this document: for example a trip step that cannot be completed, an offline upload that is lost, a wrong points or income total, or a notification that is not delivered.</li><li>A screen that shows wrong data because of a platform bug (wrong trip, wrong driver, wrong amount) while the data in the FMS is correct.</li><li>A failure on the platform's side of an integration feed (IF-01 to IF-12) while the FMS interface agreed in week 1 is unchanged.</li><li>Security fixes to the delivered code.</li><li>Fixes to the documentation and the deployment scripts delivered in week 8 when they do not match the system.</li></ul><p><strong>Not covered: handled as a change request (11.2) or under the maintenance retainer (10.</strong><strong>6</strong><strong>)</strong></p><ul class=\"bullet\"><li>New screens, fields, reports, roles, rules, languages or integrations, and changes to how an agreed screen looks or flows.</li><li>Should and Could requirements, and anything not written in this document.</li><li>Changes in the FMS, the HR system or their APIs after the week 1 freeze, and problems caused by the FMS data itself.</li><li>Problems caused by the client's server, network, backups, Firebase or Claude accounts, or by changes the client's team makes to the deployed code or configuration.</li><li>Content and setup work: reward items, message templates, training records, users and roles in the FMS.</li><li>Day-to-day user support and training beyond the orientation session in week 8.</li></ul><p><strong>How warranty fixes work</strong></p><ul class=\"bullet\"><li>The client reports a defect in writing (email or the agreed channel) with the screen, the user, the time and the steps to reproduce it. The platform's error and audit logs are used to confirm it.</li><li>Every report is acknowledged within one business day. A defect that stops drivers from completing trips is worked on the same day; other defects are grouped into the next fix release, normally within five business days.</li><li>Fixes go to UAT first and to production with the client's go-ahead, the same way as during the project.</li><li>The warranty covers fixing the defect and any data it corrupted. It does not cover re-entering data lost for other reasons.</li><li>Reports received after the 30 days are handled under the maintenance retainer or as change requests.</li></ul><h4 id=\"s45\">11.3 Client responsibilities and delays</h4><ul class=\"bullet\"><li>By kickoff: FMS API access or documentation, accounts listed in section 8.2, a named product owner.</li><li>Decisions and answers within two working days.</li><li>Delays on the client side move the timeline day for day; the price does not change. If work is blocked for more than 30 days, the next milestone invoice falls due.</li></ul><h4 id=\"s46\">11.4 Acceptance</h4><ul class=\"bullet\"><li>M1 opens a UAT period of 10 working days for reporting defects against the Must list.</li><li>M2 is accepted when no Must defect is open, or 10 working days after the orientation session if no written objection is received.</li></ul><h4 id=\"s47\">11.5 Support, confidentiality and other terms</h4><ul class=\"bullet\"><li>Month 2 support: defect fixes, the 20 hours of small changes, and a response within one working day to blocking issues.</li><li>Confidentiality: a mutual NDA; client data is accessed only for the project and never used to train models.</li><li>Warranty: 30 days after M2 for defects.</li><li>Termination: either side with two weeks' written notice; paid milestones are not refundable; all code delivered to date stays with the client.</li><li>Governing law: Egypt.</li></ul><h3 id=\"s48\">12. Open questions and app name</h3><p>These answers are needed in the discovery week; none of them changes the price, but several change the fallbacks in section 7.</p><h4 id=\"s49\">12.1 Open questions for the client</h4><ol class=\"ordered\"><li>Fleet size for the pilot and in total: drivers, trucks, sites, trips per day.</li><li>Rewards the company is willing to put in the loyalty catalogue.</li><li>Phones: company-issued or the drivers' own, and the oldest Android version in use.</li><li>Pilot site and pilot group, with a date they can start.</li><li>Who signs acceptance, and who is the day-to-day product owner.</li></ol><h4 id=\"s50\">12.2 App name options</h4><div class=\"tbl-wrap\"><table class=\"tbl doc\"><tbody><tr><th>Name</th><th>Meaning</th><th>Why it works</th></tr><tr><td>Masar (مسار)</td><td>Route, path</td><td>Reads well in Arabic and English, fits trips and progress</td></tr><tr><td>Darb (درب)</td><td>Road, track</td><td>Short and strong, easy to say and to brand</td></tr><tr><td>Wasel (واصل)</td><td>Arriving, connected</td><td>Positive: the load arrives, the driver stays connected</td></tr><tr><td>Sawwaq (سوّاق)</td><td>Driver</td><td>Friendly and informal, good for the driver app alone</td></tr><tr><td>Naqel (ناقل)</td><td>Carrier, hauler</td><td>Descriptive of the business, more formal</td></tr></tbody></table></div><p>Check store and domain availability before choosing, and keep the name out of the code so it can change without a rebuild.</p>";

const S = { driver:{}, web:{}, admin:{} };
const reg = (app,key,def)=>{ S[app][key]=Object.assign({key,app},def); };

const state = { app:'srs', screen:'', params:{}, hist:[], hot:true, hintClosed:false, night:false, role:'coordinator', loggedIn:false, sheet:null, toast:null, modal:null, ui:{} };
try{ const h=localStorage.getItem('masar-hot'); if(h!==null) state.hot = h==='1'; }catch(e){}
(function(){ let t='light'; try{ t=localStorage.getItem('roms-theme')||'light'; }catch(e){} document.documentElement.setAttribute('data-theme', t); })();

function go(app, screen, params={}, opts={}){
  if(state.app!=='map' && (state.screen||state.app==='srs') && !opts.replace) state.hist.push({app:state.app, screen:state.screen, params:state.params});
  if(state.hist.length>40) state.hist.shift();
  state.app=app; state.screen=screen; state.params=params; state.sheet=null; state.modal=null;
  if(app==='driver' && screen!=='login' && screen!=='pin' && screen!=='splash') state.loggedIn=true;
  render();
  const body=document.querySelector('.pbody, .wbody'); if(body) body.scrollTop=0;
}
function back(){ const p=state.hist.pop(); if(!p){ go(state.app==='srs'?'map':'srs','',{}, {replace:true}); return; } state.app=p.app; state.screen=p.screen; state.params=p.params; state.sheet=null; state.modal=null; render(); }
function toast(msg, ms=2200){ state.toast=msg; render(); clearTimeout(toast.t); toast.t=setTimeout(()=>{state.toast=null; render();}, ms); }
function sheet(html){ state.sheet=html; render(); }
function modal(html){ state.modal=html; render(); }
function closeOverlays(){ state.sheet=null; state.modal=null; render(); }

/* ---- click delegation ---- */
document.addEventListener('click', e=>{
  if(e.target.classList && (e.target.classList.contains('modal') || e.target.classList.contains('sheet'))){ closeOverlays(); return; }
  const act=e.target.closest('[data-act]');
  if(act){ e.preventDefault(); const name=act.dataset.act; const arg=act.dataset.arg; (ACTS[name]||(()=>{}))(arg, act, e); return; }
  const g=e.target.closest('[data-go]');
  if(g){ e.preventDefault(); const [app,screen,...rest]=g.dataset.go.split('/'); const id=rest.join('/'); go(app, screen||'', id? {id}:{}); }
});

reg('driver','trips',{title:'رحلاتي', en:'My trips', tab:'trips', desc:"Today's and upcoming trips with origin, destination, cargo, payload, truck and waybill; each card reads itself aloud.", fr:['FR-DRV-02','FR-DRV-03','FR-DRV-06','FR-DRV-07','FR-DRV-19','FR-DRV-22'],
  notes:['The AI assistant card and the floating button both open the assistant (FR-DRV-19).','Tap the play button: the trip is read aloud (FR-DRV-03).','Tap a card to open the trip.','Tap "رفع بوليصة" to open a trip from a waybill (FR-DRV-06).','The queue chip shows pending uploads (FR-DRV-07).'], render:()=>{
  const d=me(); const mine=D.trips.filter(t=>t.driver===D.me && t.status!=='done');
  const running=mine.filter(t=>t.status==='running'), rest=mine.filter(t=>t.status!=='running');
  return `<div class="pbody">
    <div class="phead" style="padding-top:4px"><div style="flex:1"><div class="sub">صباح الخير، ${d.ar.split(' ')[0]} 👋</div><h2>رحلاتي · اليوم</h2></div>${running.length?trackChip():''}</div>
    <div class="pc">
      <div class="chip-row"><span class="chip ac">${ic('trophy')}المركز ${n(d.rankSite)} في السخنة</span><span class="chip">${ic('star')}${n(d.points)} نقطة</span><button class="chip warn" data-go="driver/queue">${ic('upload')}${n(2)} في انتظار الرفع</button></div>
      <button class="aihome" data-go="driver/assistant"><span class="orb">${ic('sparkle')}</span><span class="tx"><b>المساعد الذكي</b><span>اسألني عن رحلتك أو نقاطك، أو املِ طلب مساعدة بصوتك</span></span><span class="mic">${ic('mic')}</span></button>
      ${running.map(t=>`<div class="card" style="border-color:var(--p-ac)"><div class="row sb"><span class="chip ac"><span class="pulse" style="width:7px;height:7px;border-radius:50%;background:var(--p-ac);display:inline-block"></span>رحلة جارية</span><span class="xs mu">بدأت ${n(t.stepTimes[0])}</span></div>
        <h3 style="margin:8px 0 4px">${D.route(t.route).ar}</h3>
        <div class="sm mu" style="margin-bottom:10px">الخطوة الحالية: <b style="color:var(--p-fg)">${D.route(t.route).steps[t.stepIdx].ar}</b></div>
        ${(()=>{const c=curLeg(t); return c?`<div class="legbox ${c.st}" style="padding:10px 12px"><div class="row sb"><span class="lbl">${c.l.ar}</span><span class="lbl">القياسي ${n(D.fmt(c.l.std))}</span></div><div class="row sb"><span class="big" style="font-size:26px">${D.fmt(c.used)}</span><span class="lbl">${c.margin>=0?`متبقي ${n(D.fmt(c.margin))}`:`تجاوز ${n(D.fmt(-c.margin))}`}</span></div></div>`:''})()}
        <button class="btn" style="margin-top:10px" data-go="driver/run/${t.id}">${ic('route')}متابعة الرحلة</button></div>`).join('')}
      <div class="seg"><button aria-selected="true">اليوم (${n(rest.length+running.length)})</button><button data-act="toast" data-arg="لا توجد رحلات قادمة بعد اليوم">القادمة</button></div>
      ${rest.map(t=>tripCard(t)).join('')}
      <button class="btn sec" data-go="driver/upload">${ic('camera')}رفع بوليصة لفتح رحلة جديدة</button>
    </div></div>`; }});

/* --- trip details --- */
reg('driver','trip',{title:'تفاصيل الرحلة', en:'Trip details', demo:'T-2617', tab:'trips', desc:'Full trip card with the route steps from the FMS template and the actions: start, call coordinator, raise RFR.', fr:['FR-DRV-02','FR-DRV-04','FR-DRV-09','FR-DRV-23'],
  notes:['"ابدأ الرحلة" starts tracking and opens the step screen.','"اتصال بالمنسق" logs a call against the trip (FR-DRV-09).'], render:({id})=>{
  const t=D.trip(id)||D.trip('T-2617'); const r=D.route(t.route);
  return `<div class="pbody">${phead(r.ar,{sub:`${t.id} · بوليصة ${n(t.waybill)}`, right:`<button class="pb" data-act="read" data-arg="${t.id}">${ic('play')}</button>`})}<div class="pc">
    ${t.byDriver&&t.status==='planned'?`<div class="card" style="background:var(--info-soft);border-color:transparent;color:var(--info)"><b>رحلة فتحتها بالبوليصة</b><div class="sm">فُتحت الساعة ${n(t.uploadedAt)} وظهرت للمنسق وسُجّلت في نظام الأسطول. يمكنك البدء الآن.</div></div>`:''}
    <div class="card"><div class="kv">
      <div><span>موعد البدء</span><b>${n(t.start)}</b></div><div><span>الشاحنة</span><b>${n(t.truck||'—')}</b></div>
      <div><span>الحمولة</span><b>${t.cargoAr}</b></div><div><span>الوزن المخطط</span><b>${n(t.payload)} طن</b></div>
      <div><span>الوقت القياسي للرحلة</span><b>${n(D.fmt(r.total))}</b></div><div><span>قالب المسار (FMS)</span><b>${n(r.id+' · '+r.version.split(' · ')[0])}</b></div>
    </div></div>
    <div class="card"><h3 style="margin-bottom:6px">خطوات الرحلة</h3><div class="xs mu" style="margin-bottom:6px">من قالب المسار في نظام الأسطول. كل خطوة تحتاج مستندًا.</div>
      <div class="steps">${r.steps.map((s,i)=>`<div class="step ${stepState(t,i)}"><span class="bul">${i<t.stepIdx?ic('check'):n(i+1)}</span><div><div class="t">${s.ar}</div><button class="doc" data-act="docInfo" data-arg="${t.id}|${i}">${ic('camera')}${s.docAr}${ic('chev')}</button>${i<r.legs.length?`<div class="m">ثم: ${r.legs[i].ar} · قياسي ${n(D.fmt(r.legs[i].std))}</div>`:''}</div><span class="xs mu">${t.stepTimes[i]?n(t.stepTimes[i]):''}</span></div>`).join('')}</div></div>
    ${t.status==='running'?`<button class="btn" data-go="driver/run/${t.id}">${ic('route')}متابعة الرحلة</button>` : `<button class="btn" data-act="startTrip" data-arg="${t.id}">${ic('play')}ابدأ الرحلة</button>`}
    <div class="btn-row"><button class="btn sec" data-act="call" data-arg="${t.id}">${ic('phone')}اتصال بالمنسق</button><button class="btn sec" data-go="driver/rfr-new/${t.id}">${ic('alert')}طلب مساعدة</button></div>
  </div></div>`; }});
ACTS.startTrip = (id)=>{ const t=D.trip(id); t.status='running'; t.stepIdx=0; t.curUsed=0; t.pos={x:300,y:230}; toast('بدأ التتبع · التطبيق يسجّل الموقع كل ٣٠–٦٠ ثانية'); go('driver','run',{id}); };
ACTS.call = (id)=>{ sheet(`<div style="text-align:center;padding:10px 0"><span class="av" style="width:64px;height:64px;font-size:22px;margin:0 auto 10px;background:var(--p-acs);color:var(--p-ac)">${ic('phone')}</span><h3>منى عادل · منسقة السخنة</h3><p class="mu sm">جارٍ الاتصال… ${n('00:04')}</p><p class="xs mu" style="margin-top:6px">تُسجَّل المكالمة على الرحلة ${n(id)} (FR-DRV-09)</p></div><button class="btn danger" data-act="endCall" data-arg="${id}">${ic('phone')}إنهاء المكالمة</button>`); };
ACTS.endCall = (id)=>{ const t=D.trip(id); if(t) t.calls.push({t:D.now,dur:'0:48',by:'driver'}); closeOverlays(); toast('سُجّلت المكالمة على الرحلة'); };

/* --- trip in progress --- */
reg('driver','run',{title:'الرحلة الجارية', en:'Trip in progress', demo:'T-2611', tab:false, desc:'Ordered steps with time and GPS stamp, the leg timer against the FMS standard, break, delay reason, background tracking indicator.', fr:['FR-DRV-04','FR-DRV-05','FR-DRV-16','FR-DRV-22','FR-DRV-23'],
  notes:['"إتمام الخطوة" opens the camera for the required document.','"استراحة" starts a break excluded from driving time (FR-DRV-16).','When the margin is negative the app asks for a delay reason (FR-DRV-23).'], render:({id})=>{
  const t=D.trip(id)||D.trip('T-2611'); const r=D.route(t.route); const c=curLeg(t); const s=r.steps[t.stepIdx];
  if(!s) return `<div class="pbody">${phead(r.ar)}<div class="pc"><div class="cert"><div class="seal">${ic('check')}</div><h3>اكتملت الرحلة</h3><p class="mu sm">أُرسلت كل الخطوات والمستندات. حصلت على ${n(84)} نقطة.</p></div><button class="btn" data-go="driver/trips">العودة لرحلاتي</button></div></div>`;
  const onBreak = state.ui['break-'+t.id];
  return `<div class="pbody">${phead(r.ar,{sub:`${t.id} · ${n(t.truck)}`, right:trackChip()})}<div class="pc">
    ${onBreak?`<div class="card" style="background:var(--info-soft);border-color:transparent"><div class="row sb"><b style="color:var(--info)">${ic('coffee')} استراحة جارية · ${n('00:12:40')}</b><button class="btn sm" data-act="breakEnd" data-arg="${t.id}">إنهاء الاستراحة</button></div><div class="xs mu" style="margin-top:4px">دقائق الاستراحة لا تُحسب ضمن وقت القيادة.</div></div>`:''}
    ${c?`<div class="legbox ${c.st}"><div class="lbl">المرحلة الحالية</div><div style="font-size:17px;font-weight:800;margin:2px 0 4px">${c.l.ar}</div><div class="lbl">الوقت القياسي ${n(D.fmt(c.l.std))} · سماح ${n(c.l.tol)} دقائق</div>
      <div class="row sb" style="margin-top:6px;align-items:flex-end"><span class="big">${D.fmt(c.used)}</span><span style="text-align:left"><span class="lbl">${c.margin>=0?'المتبقي':'التجاوز'}</span><br><b class="num" style="font-size:20px">${D.fmt(Math.abs(c.margin))}</b></span></div>
      <div class="bar"><i style="width:${Math.min(100,c.used/c.l.std*100)}%"></i></div>
      ${c.st==='over'&&!t.delayReason?`<button class="btn" style="margin-top:12px;background:#fff;color:#7a1410" data-act="delaySheet" data-arg="${t.id}">${ic('alert')}تجاوزت الوقت القياسي · اختر سبب التأخير</button>`: t.delayReason?`<div class="lbl" style="margin-top:8px">سبب التأخير المُرسل للمنسق: <b>${t.delayReason}</b></div>`:''}
    </div>`:`<div class="card" style="background:var(--p-acs);border:0"><b style="color:var(--p-ac)">الرحلة بدأت</b><div class="sm mu">المرحلة الأولى تبدأ بعد تأكيد الوصول للتحميل.</div></div>`}
    <div class="card"><div class="row sb"><h3>الخطوة ${n(t.stepIdx+1)} من ${n(r.steps.length)}</h3><span class="chip">${ic('gps')}GPS · دقة ${n(6)} م</span></div>
      <div style="font-size:22px;font-weight:800;margin:6px 0 2px">${s.ar}</div>
      <div class="sm mu">المستند المطلوب: <button class="doc" style="font-size:12.5px" data-act="docInfo" data-arg="${t.id}|${t.stepIdx}">${ic('camera')}${s.docAr}${ic('chev')}</button> · لا تُغلق الخطوة بدونه</div>
      <button class="btn" style="margin-top:12px" data-go="driver/capture/${t.id}">${ic('camera')}تصوير ${s.docAr} وإتمام الخطوة</button></div>
    <div class="btn-row">${onBreak?'':`<button class="btn sec" data-act="breakStart" data-arg="${t.id}">${ic('coffee')}استراحة</button>`}<button class="btn sec" data-act="call" data-arg="${t.id}">${ic('phone')}المنسق</button><button class="btn sec" data-go="driver/rfr-new/${t.id}">${ic('alert')}مشكلة</button></div>
    <div class="card"><h3 style="margin-bottom:4px">كل الخطوات</h3><div class="steps">${r.steps.map((st,i)=>`<div class="step ${stepState(t,i)}"><span class="bul">${i<t.stepIdx?ic('check'):n(i+1)}</span><div><div class="t">${st.ar}</div>${i<t.stepIdx?`<div class="m">${ic('check')} ${st.docAr} مرفوع${i<t.legActual.length?` · المرحلة التالية ${n(D.fmt(t.legActual[i]))} <span class="chip ${D.legStatus(r,i,t.legActual[i])==='ok'?'ok':D.legStatus(r,i,t.legActual[i])==='tol'?'warn':'bad'}" style="padding:1px 6px">${{ok:'في الوقت',tol:'ضمن السماح',over:'تجاوز'}[D.legStatus(r,i,t.legActual[i])]}</span>`:''}</div>`:`<button class="doc" data-act="docInfo" data-arg="${t.id}|${i}">${ic('camera')}${st.docAr}${ic('chev')}</button>`}</div><span class="xs mu num">${t.stepTimes[i]||''}</span></div>`).join('')}</div></div>
    <p class="xs mu" style="text-align:center">يعمل التتبع في الخلفية أثناء الرحلة فقط، مع إشعار ظاهر. إغلاق GPS يُسجَّل كفجوة وينبّه المشرف.</p>
  </div></div>`; }});
ACTS.breakStart=(id)=>{ state.ui['break-'+id]=true; toast('بدأت الاستراحة'); };
ACTS.breakEnd=(id)=>{ state.ui['break-'+id]=false; toast('انتهت الاستراحة · ١٣ دقيقة مستبعدة من وقت القيادة'); };
ACTS.delaySheet=(id)=>{ sheet(`<h3>سبب التأخير</h3><p class="sm mu">يصل للمنسق فورًا ويُحفظ على المرحلة.</p>${[['زحام مروري','Traffic'],['طابور / انتظار','Queue'],['عطل في الشاحنة','Breakdown'],['سبب آخر','Other']].map(x=>`<button class="opt" data-act="delayPick" data-arg="${id}|${x[1]}">${x[0]}${ic('chev','')}</button>`).join('')}`); };
ACTS.delayPick=(a)=>{ const [id,why]=a.split('|'); D.trip(id).delayReason=why; closeOverlays(); toast('أُرسل سبب التأخير للمنسق'); };

/* --- document capture + AI check --- */
reg('driver','capture',{title:'تصوير المستند', en:'Document capture + AI check', demo:'T-2611', tab:false, desc:'Camera for the step document; the model reads the key fields and flags blur or mismatch before the step closes.', fr:['FR-DRV-05','FR-AI-03'],
  notes:['Press the shutter: the AI reads the fields and compares them with the trip.','"اعتماد" closes the step and moves the trip to the next leg.'], render:({id})=>{
  const t=D.trip(id)||D.trip('T-2611'); const r=D.route(t.route); const s=r.steps[t.stepIdx]; const shot=state.ui['shot-'+t.id];
  return `<div class="pbody">${phead(s.docAr,{sub:`${s.ar} · ${t.id}`})}<div class="pc">
    <div class="cam"><div class="frame"></div>${shot?`<div class="paper"><b>GATE PASS · ATAQA CEMENT</b>Waybill: WB-88213<br>Truck: SKN-214<br>Date: 04/11/2026 09:38<br>Net: 27.6 t<br>Gate: 3</div>`:`<span class="sm" style="opacity:.8">ضع المستند داخل الإطار</span>`}</div>
    ${shot?`<div class="ai"><div class="tag">${ic('sparkle')}فحص المستند بالذكاء الاصطناعي</div>
      <div class="kv"><div><span>رقم البوليصة</span><b>${n('WB-88213')} ${ic('check')}</b></div><div><span>الشاحنة</span><b>${n('SKN-214')} ${ic('check')}</b></div><div><span>الوزن الصافي</span><b>${n('27.6')} طن</b></div><div><span>التاريخ</span><b>${n('04/11 09:38')}</b></div></div>
      <div class="sm" style="margin-top:8px;color:var(--ok)">${ic('check')} الصورة واضحة والبيانات مطابقة للرحلة. الوزن ${n('98.6%')} من المخطط.</div></div>
      <button class="btn" data-act="closeStep" data-arg="${t.id}">${ic('check')}اعتماد وإغلاق الخطوة</button><button class="btn sec" data-act="reshoot" data-arg="${t.id}">${ic('camera')}إعادة التصوير</button>`
    :`<button class="shutter" data-act="shoot" data-arg="${t.id}" aria-label="تصوير"></button><p class="xs mu" style="text-align:center">تُضغط الصورة إلى نحو ٣٠٠ كيلوبايت وتُرفع عند توفر الشبكة.</p>`}
  </div></div>`; }});
ACTS.shoot=(id)=>{ state.ui['shot-'+id]=true; render(); };
ACTS.reshoot=(id)=>{ state.ui['shot-'+id]=false; render(); };
ACTS.closeStep=(id)=>{ const t=D.trip(id); const r=D.route(t.route); state.ui['shot-'+id]=false; t.stepTimes[t.stepIdx]=D.now; if(t.stepIdx>=1 && t.legActual.length<t.stepIdx){ t.legActual.push(t.curUsed||0);} t.stepIdx++; t.curUsed=0; t.delayReason=null; if(t.stepIdx>=r.steps.length){ t.status='done'; } toast('أُغلقت الخطوة · المستند في قائمة الرفع'); go('driver','run',{id}); };

/* --- upload waybill to open a trip --- */
reg('driver','upload',{title:'رفع بوليصة', en:'Open a trip from a waybill', tab:false, desc:'When no dispatch exists, the driver photographs the waybill; the AI reads it, the driver checks the fields, and the trip opens at once, marked as opened by the driver, on the coordinator\'s board. No approval step.', fr:['FR-DRV-06','FR-AI-03','IF-05'],
  notes:['Shoot, check the fields, then open: the trip appears in My trips and on the coordinator\'s board tagged "Opened by driver".'], render:()=>{
  const shot=state.ui['wb-shot'];
  return `<div class="pbody">${phead('رفع بوليصة',{sub:'فتح رحلة بدون توزيع من المنسق'})}<div class="pc">
    <div class="cam"><div class="frame"></div>${shot?`<div class="paper"><b>WAYBILL / بوليصة شحن</b>No: WB-88231<br>From: Sokhna Port<br>To: Ataqa Cement<br>Cargo: Clinker 28 t<br>Truck: SKN-214</div>`:`<span class="sm" style="opacity:.8">صوّر البوليصة كاملة</span>`}</div>
    ${shot?`<div class="ai"><div class="tag">${ic('sparkle')}قراءة البوليصة</div><div class="kv"><div><span>رقم البوليصة</span><b>${n('WB-88231')}</b></div><div><span>المسار المقترح</span><b>السخنة ← عتاقة</b></div><div><span>الحمولة</span><b>كلنكر · ${n(28)} طن</b></div><div><span>الشاحنة</span><b>${n('SKN-214')}</b></div></div><div class="xs mu" style="margin-top:6px">راجع البيانات قبل الفتح. تظهر الرحلة للمنسق فورًا ويمكنه تصحيحها.</div></div>
      <button class="btn" data-act="createTrip">${ic('check')}فتح الرحلة الآن</button><button class="btn sec" data-act="wbReshoot">إعادة التصوير</button>`
    :`<button class="shutter" data-act="wbShoot" aria-label="تصوير"></button>`}
  </div></div>`; }});
ACTS.wbShoot=()=>{ state.ui['wb-shot']=true; render(); };
ACTS.wbReshoot=()=>{ state.ui['wb-shot']=false; render(); };
ACTS.createTrip=()=>{ state.ui['wb-shot']=false; if(!D.trip('T-2631')) D.trips.splice(9,0,{id:'T-2631', driver:'d1', route:'R1', truck:'SKN-214', cargo:'Clinker', cargoAr:'كلنكر', payload:28, actual:null, waybill:'WB-88231', status:'planned', byDriver:true, start:'10:15', stepIdx:0, stepTimes:[null,null,null,null,null,null], legActual:[], pos:null, calls:[], notes:[], wait:null, delayReason:null, uploadedAt:D.now}); toast('فُتحت الرحلة T-2631 وظهرت للمنسق'); go('driver','trips',{}); };

reg('driver','rfr-new',{title:'طلب مساعدة جديد', en:'Raise an RFR (voice)', tab:false, desc:'Category, voice note transcribed and summarized by AI, text, photo and location. One tap sends the request to the FMS (IF-06), where it is handled.', fr:['FR-DRV-08','FR-AI-01','IF-06'],

  const cat=state.ui.rfrCat||null; const voice=state.ui.rfrVoice;

    ${voice?`<div class="ai"><div class="tag">${ic('sparkle')}ما فهمه التطبيق</div><div class="sm" style="line-height:1.8">«${state.ui.rfrFromAssistant?'الفرامل بتعمل صوت غريب وعايز حد يبص عليها':'لمبة الفرامل نورت من رصيف التحميل والدواسة طرية شوية، أنا ماشي بالراحة بس عايز حد يبص عليها في عتاقة.'}»</div>
      <div class="xs mu" style="margin:8px 0 4px">ملخص للمشرف</div><div class="sm b">${state.ui.rfrFromAssistant?'صوت غير طبيعي من الفرامل على الشاحنة SKN-214 أثناء الرحلة T-2611. السائق يطلب فحصًا.':'تحذير فرامل منذ رصيف التحميل، الدواسة طرية. السائق يواصل بسرعة منخفضة ويطلب فحصًا عند الوصول لعتاقة.'}</div>
      <div class="row" style="margin-top:8px;gap:6px"><span class="chip ac">التصنيف: عطل</span><span class="chip">الأولوية: عالية</span></div></div>`:''}
    <div class="field"><label>أو اكتب</label><textarea placeholder="اكتب المشكلة باختصار…">${voice?(state.ui.rfrFromAssistant?'صوت غير طبيعي من الفرامل، مطلوب فحص.':'تحذير فرامل منذ رصيف التحميل، الدواسة طرية.'):''}</textarea></div>
    <div class="btn-row"><button class="btn sec sm" style="flex:1" data-act="toast" data-arg="أُضيفت صورة">${ic('camera')}إضافة صورة</button><span class="chip" style="flex:1;justify-content:center;min-height:38px">${ic('pin')}ميناء السخنة، بوابة ٢</span></div>
    <button class="btn" data-act="rfrSend" data-arg="${id||''}">${ic('check')}إرسال الطلب إلى نظام الأسطول</button>
  </div></div>`; }});
ACTS.rfrCat=(k)=>{ state.ui.rfrCat=k; render(); };
ACTS.rfrVoice=()=>{ state.ui.rfrVoice=true; state.ui.rfrCat='repair'; render(); };
ACTS.rfrSend=(id)=>{ const cat=state.ui.rfrCat||'repair'; const c=D.rfrCats.find(x=>x.k===cat); const nid='RFR-31'+(D.rfrs.length-3); D.rfrs.unshift({id:nid, trip:id||'T-2611', driver:D.me, cat, catAr:c.ar, text:'Brake warning since loading bay, soft pedal. Driver continues at low speed, asks for a check at Ataqa.', textAr:'تحذير فرامل منذ رصيف التحميل، الدواسة طرية.', status:'open', opened:D.now, age:'now', esc:0, assignee:null, voice:!!state.ui.rfrVoice, loc:'Sokhna Port, gate 2', actions:[], resolution:null}); state.ui.rfrVoice=false; state.ui.rfrCat=null; state.ui.rfrFromAssistant=false; toast(`أُرسل الطلب ${nid} إلى نظام الأسطول`); go('driver','rfr',{}); };

reg('driver','rfr',{title:'طلباتي', en:'My RFRs', tab:false, desc:'Status of every request raised by the driver, as reported by the FMS where it is handled; a closed one asks to confirm or escalate.', fr:['FR-DRV-08','IF-06'], render:()=>{
  const mine=D.rfrs.filter(r=>r.driver===D.me);

  return `<div class="pbody">${phead('طلبات المساعدة',{right:`<button class="pb" data-go="driver/rfr-new">${ic('plus')}</button>`})}<div class="pc"><div class="card">${mine.map(r=>`<div class="listrow" data-go="driver/rfr-detail/${r.id}"><span class="ic">${ic(r.cat==='repair'?'truck':r.cat==='document'?'doc':r.cat==='payment'?'wallet':'route')}</span><div class="tx"><b>${r.catAr} · ${n(r.id)}</b><span>${r.textAr}</span><div style="margin-top:4px">${chip(r.status)} <span class="xs mu">${n(r.opened)}${r.esc?` · تصعيد ×${n(r.esc)}`:''}</span></div></div>${ic('chev','chev')}</div>`).join('')}</div></div></div>`; }});
reg('driver','rfr-detail',{title:'تفاصيل الطلب', en:'RFR status', demo:'RFR-298', tab:false, desc:'Actions and resolution as recorded in the FMS (IF-06), the closing notification, and one tap to confirm solved or escalate again; the escalation is sent back to the FMS.', fr:['FR-DRV-08','FR-DRV-17','IF-06'], notes:['On the closed request RFR-298, tap "لم تُحل" to escalate: it is sent back to the FMS and reopened there.'], render:({id})=>{
  const r=D.rfr(id)||D.rfr('RFR-298'); const t=D.trip(r.trip);

    <div class="card"><div class="row sb"><span class="chip ${ {open:'warn',in_progress:'info',closed:'ok',escalated:'bad'}[r.status]}">${ {open:'مفتوح',in_progress:'قيد المعالجة',closed:'مغلق',escalated:'مُصعَّد'}[r.status]}</span><span class="xs mu">${n(r.opened)} · ${r.locAr||r.loc}</span></div><p style="margin-top:10px;line-height:1.8">${r.textAr}</p>${r.voice?`<div class="row" style="margin-top:8px;gap:8px"><button class="btn round soft" style="width:40px;height:40px" data-act="toast" data-arg="تشغيل التسجيل الصوتي">${ic('play')}</button><span class="sm mu">تسجيل صوتي · ١٨ ث</span></div>`:''}</div>
    <div class="card"><div class="row sb" style="margin-bottom:6px"><h3>المتابعة</h3><span class="chip">${ic('link')}من نظام الأسطول</span></div><div class="steps">${r.actions.length?r.actions.map(a=>`<div class="step done"><span class="bul">${ic('check')}</span><div><div class="t" style="font-weight:600" dir="auto">${a.ar||a.txt}</div><div class="m">${a.whoAr||a.who}</div></div><span class="xs mu num">${a.t}</span></div>`).join(''):'<div class="sm mu">أُرسل إلى نظام الأسطول · في انتظار المشرف</div>'}</div></div>
    ${r.resolution?`<div class="card" style="border-color:var(--ok)"><div class="xs mu">نتيجة الإغلاق</div><b dir="auto">${r.resolutionAr||r.resolution}</b></div>`:''}
    ${r.status==='closed'&&!r.confirmedByMe?`<div class="btn-row"><button class="btn" data-act="rfrConfirm" data-arg="${r.id}">${ic('check')}تم الحل</button><button class="btn danger" data-act="rfrEsc" data-arg="${r.id}">${ic('alert')}لم تُحل · تصعيد</button></div>`:''}
    ${r.status==='escalated'?`<div class="card" style="background:var(--danger-soft);border-color:transparent;color:var(--danger)"><b>مُصعَّد ×${n(r.esc)}</b><div class="sm">أُعيد فتح الطلب عند المشرف.</div></div>`:''}
  </div></div>`; }});
ACTS.rfrConfirm=(id)=>{ D.rfr(id).confirmedByMe=true; toast('شكرًا · أُغلق الطلب نهائيًا'); };
ACTS.rfrEsc=(id)=>{ const r=D.rfr(id); r.status='escalated'; r.esc++; r.actions.push({t:D.now,who:me().en+' (driver)',txt:'Escalated: not solved yet.',ar:'تصعيد: لم تُحل بعد.',whoAr:me().ar+' (السائق)'}); toast('أُعيد فتح الطلب في نظام الأسطول وأُبلغ المشرف'); };

  </div></div>`; }});

reg('driver','income',{title:'الدخل', en:'Income', tab:false, desc:'Earnings per trip, per day, per week and per month, with bonuses and deductions. Display only, from the HR/FMS figures (IF-07).', fr:['FR-DRV-11','IF-07'], notes:['Switch رحلة / يوم / أسبوع / شهر; the total at the top follows the selection.','Tap a trip line to open that trip\'s record.'], render:()=>{
  const per=state.ui.incPer||'trip'; const money=v=>`${n(v.toLocaleString('en'))} <span style="font-size:12px;font-weight:600">ج</span>`;
  const head = {
    trip:{lbl:'آخر ٧ رحلات', v:INC.trips.reduce((a,x)=>a+x.v,0), sub:`${n(INC.trips.length)} رحلات · متوسط ${n(Math.round(INC.trips.reduce((a,x)=>a+x.v,0)/INC.trips.length))} ج للرحلة`},
    day:{lbl:'اليوم · ٤ نوفمبر', v:650, sub:'رحلة واحدة مكتملة · رحلة جارية تُضاف عند الإغلاق'},
    week:{lbl:'هذا الأسبوع · ٢–٤ نوفمبر', v:4150, sub:`${n(5)} رحلات ${n(3250)} + مكافأة ${n(900)}`},

  }[per];
  const sumRow = x=>`<div class="row sb xs mu" style="margin-top:2px;gap:10px;flex-wrap:wrap"><span>${n(x.trips)} رحلات · ${n(x.v.toLocaleString('en'))} ج</span>${x.bonus?`<span style="color:var(--ok)">مكافآت +${n(x.bonus)}</span>`:''}${x.ded?`<span style="color:var(--danger)">خصومات ${n(x.ded)}</span>`:''}</div>`;

    : per==='day' ? INC.days.map(x=>`<div class="listrow"><span class="ic" style="${x.open?'color:var(--warn)':''}">${ic('cal')}</span><div class="tx"><b style="font-weight:600">${x.ar}</b><span>${n(x.trips)} ${x.trips>1?'رحلات':'رحلة'}${x.note?' · '+x.note:''}${x.bonus?` · <span style="color:var(--ok)">${x.bonusAr} +${n(x.bonus)}</span>`:''}${x.ded?` · <span style="color:var(--danger)">${x.dedAr} ${n(x.ded)}</span>`:''}</span></div><b class="num">${(x.v+(x.bonus||0)+(x.ded||0)).toLocaleString('en')}</b></div>`).join('')

  return `<div class="pbody">${phead('الدخل',{sub:'أرقام استرشادية من نظام الموارد البشرية (IF-07)'})}<div class="pc">

reg('driver','kpis',{title:'مؤشراتي', en:'My KPIs', tab:false, desc:'The client\'s existing KPI results read from the FMS (IF-11), plus the platform\'s own measures (legs, safety, breaks, documents), each against its target for day, week and month. The chip on each KPI shows its source.', fr:['FR-DRV-12','FR-DRV-15','IF-11'], notes:['Switch day / week / month.'], render:()=>{
  const per=state.ui.kpiPer||'day';
  return `<div class="pbody">${phead('مؤشرات الأداء',{sub:'من حساب الشركة للمؤشرات + قياسات التطبيق'})}<div class="pc">
    <div class="seg">${[['day','اليوم'],['week','الأسبوع'],['month','الشهر']].map(x=>`<button aria-selected="${per===x[0]}" data-act="kpiPer" data-arg="${x[0]}">${x[1]}</button>`).join('')}</div>
    ${D.kpis.map(k=>{ const v=k[per]; let pct, cls=''; if(k.invert){ pct=Math.max(0,100-v*25); cls=v?'bad':''; } else if(k.k==='drive'){ const tgt=per==='day'?k.target:per==='week'?k.target*5:k.target*20; pct=Math.min(100,v/tgt*100); } else { pct=Math.min(100,v/k.target*100); cls= v<k.target? (v<k.target-5?'bad':'warn'):''; }
      const tgtTxt = k.k==='drive'? `الهدف ${n(per==='day'?k.target:per==='week'?k.target*5:k.target*20)} س` : k.invert? 'الهدف صفر' : `الهدف ${n(k.target)}${k.unit==='%'?'٪':''}`;
