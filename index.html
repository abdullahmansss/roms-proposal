<style>
:root{
  --bg:#eef0f3; --surface:#ffffff; --surface-2:#f6f7f9; --fg:#141a22; --muted:#5b6774; --line:#d8dde4; --line-soft:#e8ecf0;
  --accent:#0a4a78; --accent-fg:#ffffff; --accent-soft:#e4edf6; --accent-ink:#0a4a78; --brand-orange:#f2842d;
  --warn:#c4650f; --warn-soft:#fdeede; --danger:#b42318; --danger-soft:#fde8e6; --info:#1d4ed8; --info-soft:#e3eafd; --ok:#15803d; --ok-soft:#dff5e6;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 8px 24px -12px rgba(16,24,40,.18);
  --hot:#f2842d;
  --phone-bg:#f3f4f6; --phone-surface:#fff; --phone-fg:#121820; --phone-muted:#5b6774; --phone-line:#dde2e8; --phone-accent:#0a4a78; --phone-accent-soft:#e4edf6;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif; --ar:"Cairo","IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0f1317; --surface:#171c22; --surface-2:#1e252c; --fg:#e8ecf0; --muted:#9aa6b2; --line:#2a333d; --line-soft:#222a33;
  --accent:#5fa3e0; --accent-fg:#06192a; --accent-soft:#14304a; --accent-ink:#9cc6ee;
  --warn:#f2842d; --warn-soft:#3a2510; --danger:#f0655a; --danger-soft:#3d1a17; --info:#7aa2ff; --info-soft:#1a2440; --ok:#4ade80; --ok-soft:#14321f;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px -14px rgba(0,0,0,.7); --hot:#f2842d; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0f1317; --surface:#171c22; --surface-2:#1e252c; --fg:#e8ecf0; --muted:#9aa6b2; --line:#2a333d; --line-soft:#222a33;
  --accent:#5fa3e0; --accent-fg:#06192a; --accent-soft:#14304a; --accent-ink:#9cc6ee;
  --warn:#f2842d; --warn-soft:#3a2510; --danger:#f0655a; --danger-soft:#3d1a17; --info:#7aa2ff; --info-soft:#1a2440; --ok:#4ade80; --ok-soft:#14321f;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px -14px rgba(0,0,0,.7); --hot:#f2842d; color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4{margin:0;text-wrap:balance;line-height:1.25}
p{margin:0}
a{color:var(--accent-ink)}
[hidden]{display:none!important}
svg.i{width:1.15em;height:1.15em;vertical-align:-.2em;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ---------- Shell ---------- */
.shell{min-height:100vh;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--surface);z-index:30}
.top-row{display:flex;align-items:center;gap:10px;min-height:52px;flex-wrap:wrap;padding-block:6px}
.brand{display:flex;align-items:center;gap:9px;font-weight:700;letter-spacing:.01em;margin-inline-end:6px}
.brand .logo-img{height:30px;width:auto;display:block}
.brand .logo-wrap{background:#fff;border-radius:8px;padding:3px 6px;display:flex;align-items:center}
.srs-logo{height:46px;width:auto;display:block;margin-bottom:18px}
:root[data-theme="dark"] .srs-logo{background:#fff;border-radius:10px;padding:8px 12px;height:62px}
.login-logo{width:210px;max-width:70%;height:auto;display:block;margin:0 auto 6px}
.screen.night .login-logo,.screen.night .brand-chip{background:#fff;border-radius:12px;padding:10px 14px}
.brand small{display:block;font-weight:500;color:var(--muted);font-size:11px;line-height:1.1}
.tabs{display:flex;gap:4px;background:var(--surface-2);padding:3px;border-radius:10px;flex-wrap:wrap}
.tabs button{padding:6px 12px;border-radius:8px;font-weight:600;color:var(--muted);display:flex;align-items:center;gap:6px}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--fg);box-shadow:var(--shadow)}
.top-right{margin-inline-start:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.toggle{display:inline-flex;align-items:center;gap:8px;padding:5px 10px;border:1px solid var(--line);border-radius:999px;font-size:12.5px;font-weight:600;color:var(--muted);background:var(--surface)}
.toggle .sw{width:30px;height:18px;border-radius:999px;background:var(--line);position:relative;transition:.15s}
.toggle .sw::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff;transition:.15s;box-shadow:0 1px 2px rgba(0,0,0,.3)}
.toggle[aria-pressed="true"]{color:var(--fg);border-color:var(--hot)}
.toggle[aria-pressed="true"] .sw{background:var(--hot)}
.toggle[aria-pressed="true"] .sw::after{left:14px}
.iconbtn{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);display:grid;place-items:center;color:var(--muted);background:var(--surface)}
.iconbtn:hover{color:var(--fg)}

.crumbs{display:flex;align-items:center;gap:8px;min-height:38px;border-top:1px solid var(--line-soft);font-size:13px;color:var(--muted);flex-wrap:wrap;padding-block:4px}
.crumbs .back{display:inline-flex;align-items:center;gap:4px;padding:4px 10px 4px 6px;border-radius:8px;border:1px solid var(--line);color:var(--fg);font-weight:600;background:var(--surface)}
.crumbs .back[disabled]{opacity:.4;cursor:default}
.crumbs .path{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.crumbs .path b{color:var(--fg);font-weight:600}
.crumbs .fr{margin-inline-start:auto;display:flex;gap:4px;flex-wrap:wrap}
.crumbs .fr span{font-size:11px;font-weight:600;padding:2px 7px;border-radius:6px;background:var(--accent-soft);color:var(--accent-ink);font-family:ui-monospace,SFMono-Regular,Menlo,monospace}

.stage{flex:1;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 32px}
.stage-inner{max-width:1280px;margin:0 auto}

/* hotspots */
body.hot [data-go]{outline:2px dashed var(--hot);outline-offset:-2px}
body.hot tr[data-go],body.hot .plist .it[data-go],body.hot .mcard[data-go],body.hot .tile[data-go],body.hot .wside .nav[data-go],body.hot .tabbar button[data-go]{outline:none}
body.hot tr[data-go] td:first-child,body.hot .plist .it[data-go]{box-shadow:inset 3px 0 0 var(--hot)}
body.hot [data-go]:hover{outline-style:solid}
[data-go]{cursor:pointer}
.hint{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:12px;background:var(--warn-soft);color:var(--fg);border:1px solid color-mix(in srgb,var(--hot) 40%,transparent);margin-bottom:14px;font-size:13px}
.hint b{color:var(--hot)}
.hint .x{margin-inline-start:auto;color:var(--muted)}

/* ---------- Screen map ---------- */
.map-head{display:grid;grid-template-columns:1.2fr .8fr;gap:24px;align-items:end;margin-bottom:22px}
.map-head h1{font-size:28px;font-weight:700;letter-spacing:-.01em}
.map-head p{color:var(--muted);max-width:60ch;margin-top:8px}
.map-stats{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px;min-width:110px}
.stat b{display:block;font-size:22px;font-weight:700;letter-spacing:-.02em}
.stat span{font-size:12px;color:var(--muted)}
.map-group{margin-bottom:26px}
.map-group h2{font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px;margin-bottom:10px}
.map-group h2 .dot{width:10px;height:10px;border-radius:3px}
.map-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.mcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;text-align:start;transition:.12s;min-width:0}
.mcard:hover{border-color:var(--accent);box-shadow:var(--shadow);transform:translateY(-1px)}
.mcard .n{font-size:11px;color:var(--muted);font-weight:600;letter-spacing:.04em}
.mcard .t{font-weight:600;font-size:14px}
.mcard .d{font-size:12.5px;color:var(--muted)}
.mcard .ids{display:flex;gap:4px;flex-wrap:wrap;margin-top:2px}
.mcard .ids span{font-size:10.5px;font-family:ui-monospace,Menlo,monospace;padding:1px 6px;border-radius:5px;background:var(--surface-2);color:var(--muted)}
.flowbox{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:26px}
.flowbox h2{font-size:15px;margin-bottom:10px}
.flow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.flow .st{padding:7px 11px;border-radius:9px;background:var(--surface-2);border:1px solid var(--line);font-size:13px;font-weight:500;display:flex;gap:6px;align-items:center}
.flow .st small{color:var(--muted);font-weight:500}
.flow .ar{color:var(--muted)}

/* ---------- Phone frame ---------- */
/* RTL: mirror icons that carry a direction */
.screen .ic-chev,.screen .ic-back,.screen .ic-logout,.screen .ic-volume,.screen .ic-truck{transform:scaleX(-1)}
.phone-wrap{display:flex;gap:28px;justify-content:center;align-items:flex-start;flex-wrap:wrap}
.phone{width:390px;max-width:100%;height:812px;max-height:calc(100vh - 150px);min-height:560px;background:#0b0d10;border-radius:44px;padding:12px;box-shadow:0 30px 60px -20px rgba(0,0,0,.5),0 0 0 1px rgba(255,255,255,.08) inset;position:relative;flex:none}
.screen{--p-bg:var(--phone-bg);--p-sf:var(--phone-surface);--p-fg:var(--phone-fg);--p-mu:var(--phone-muted);--p-ln:var(--phone-line);--p-ac:var(--phone-accent);--p-acs:var(--phone-accent-soft);--p-sf2:#eef0f3;
  width:100%;height:100%;border-radius:34px;background:var(--p-bg);color:var(--p-fg);overflow:hidden;display:flex;flex-direction:column;font-family:var(--ar);direction:rtl;font-size:14.5px;position:relative}
.screen.night{--p-bg:#0d1117;--p-sf:#161c24;--p-sf2:#1c232c;--p-fg:#e8ecf0;--p-mu:#9aa6b2;--p-ln:#2a333d;--p-ac:#7fb3e6;--p-acs:#15304a;color-scheme:dark}
.sbar{height:40px;display:flex;align-items:center;justify-content:space-between;padding:0 24px 0 20px;font-size:12.5px;font-weight:700;font-family:var(--sans);direction:ltr;flex:none}
.sbar .notch{position:absolute;left:50%;top:10px;transform:translateX(-50%);width:110px;height:26px;background:#0b0d10;border-radius:16px}
.sbar .r{display:flex;gap:5px;align-items:center}
.pbody{flex:1;overflow:auto;overscroll-behavior:contain;scrollbar-width:thin}
.pbody::-webkit-scrollbar{width:0}
.phead{display:flex;align-items:center;gap:10px;padding:8px 16px 10px;flex:none;background:var(--p-bg)}
.phead h2{font-size:19px;font-weight:700;flex:1;line-height:1.2}
.phead .sub{font-size:12px;color:var(--p-mu);font-weight:500}
.phead .pb{width:36px;height:36px;border-radius:10px;background:var(--p-sf);border:1px solid var(--p-ln);display:grid;place-items:center;color:var(--p-fg)}
.track{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;color:var(--p-ac);background:var(--p-acs);padding:4px 9px;border-radius:999px}
.track .pulse{width:8px;height:8px;border-radius:50%;background:var(--p-ac);box-shadow:0 0 0 0 var(--p-ac);animation:pulse 1.6s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--p-ac) 50%,transparent)}100%{box-shadow:0 0 0 9px transparent}}
.pc{padding:0 16px 30px;display:flex;flex-direction:column;gap:12px}
.card{background:var(--p-sf);border:1px solid var(--p-ln);border-radius:16px;padding:14px}
.card.tap:active{transform:scale(.99)}
.card h3{font-size:15.5px;font-weight:700}
.row{display:flex;align-items:center;gap:10px}
.row.sb{justify-content:space-between}
.mu{color:var(--p-mu)}
.sm{font-size:12.5px}
.xs{font-size:11.5px}
.b{font-weight:700}
.num{font-family:var(--sans);font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate;display:inline-block}
.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:700;background:var(--p-sf2);color:var(--p-mu)}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--danger-soft);color:var(--danger)}
.chip.info{background:var(--info-soft);color:var(--info)}
.chip.ac{background:var(--p-acs);color:var(--p-ac)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:14px;font-weight:700;font-size:15px;background:var(--p-ac);color:#fff;width:100%}
.screen.night .btn{color:#06211a}
.btn.sec{background:var(--p-sf);color:var(--p-fg);border:1px solid var(--p-ln)}
.btn.soft{background:var(--p-acs);color:var(--p-ac)}
.btn.danger{background:var(--danger);color:#fff}
.btn.sm{min-height:38px;font-size:13.5px;padding:0 14px;border-radius:11px;width:auto}
.btn.round{width:48px;height:48px;padding:0;border-radius:50%;flex:none}
.btn-row{display:flex;gap:8px}
.btn-row .btn{flex:1;min-width:0;padding:0 8px;font-size:14px;white-space:nowrap}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px}
.kv div{background:var(--p-sf2);border-radius:10px;padding:8px 10px;min-width:0}
.kv span:not(.num){display:block;font-size:11px;color:var(--p-mu)}
.kv .num{font-size:inherit;color:inherit}
.kv b{font-size:14px;font-weight:700;white-space:nowrap;display:block;overflow:hidden;text-overflow:ellipsis}
.kv b .xs{display:inline}
.seg{display:flex;background:var(--p-sf2);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;padding:8px;border-radius:9px;font-weight:700;color:var(--p-mu);font-size:13px;font-family:inherit}
.seg button[aria-selected="true"]{background:var(--p-sf);color:var(--p-fg);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.steps{display:flex;flex-direction:column}
.step{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:start;padding:10px 0;position:relative}
.step + .step{border-top:1px dashed var(--p-ln)}
.step .bul{width:26px;height:26px;border-radius:50%;border:2px solid var(--p-ln);display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--p-mu);background:var(--p-sf)}
.step.done .bul{background:var(--ok);border-color:var(--ok);color:#fff}
.step.cur .bul{border-color:var(--p-ac);color:var(--p-ac);box-shadow:0 0 0 4px var(--p-acs)}
.step .t{font-weight:700}
.step .m{font-size:12px;color:var(--p-mu)}
.step .doc{font-size:11.5px;display:inline-flex;gap:4px;align-items:center;margin-top:3px;padding:2px 8px 2px 6px;border-radius:999px;background:var(--p-sf2);color:var(--p-ac);font-weight:700}
.step .doc .ic-chev{opacity:.7}
.legbox{border-radius:16px;padding:14px;background:linear-gradient(135deg,var(--p-ac),color-mix(in srgb,var(--p-ac) 70%,#000));color:#fff}
.legbox .lbl{font-size:12px;opacity:.85}
.legbox .big{font-size:34px;font-weight:800;line-height:1;font-family:var(--sans);direction:ltr;unicode-bidi:isolate;display:inline-block}
.legbox .bar{height:8px;border-radius:99px;background:rgba(255,255,255,.25);overflow:hidden;margin-top:10px}
.legbox .bar i{display:block;height:100%;background:#fff;border-radius:99px}
.legbox.over{background:linear-gradient(135deg,#b42318,#7a1410)}
.legbox.tol{background:linear-gradient(135deg,#b45309,#7c3a05)}
.tabbar{flex:none;display:flex;justify-content:space-around;align-items:flex-end;border-top:1px solid var(--p-ln);background:var(--p-sf);padding:8px 4px 14px}
.tabbar button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:700;color:var(--p-mu);min-width:56px;padding:4px 4px;border-radius:10px;font-family:inherit}
.tabbar button[aria-selected="true"]{color:var(--p-ac)}
.tabbar button svg{width:22px;height:22px}
.tabbar button.mid{margin-top:-26px}
.tabbar button.mid .orb{width:54px;height:54px;border-radius:50%;background:linear-gradient(135deg,#0a4a78,#1d6fb8);color:#fff;display:grid;place-items:center;box-shadow:0 8px 20px -6px rgba(10,74,120,.8),0 0 0 4px var(--p-sf)}
.tabbar button.mid .orb svg{width:26px;height:26px}
.tabbar button.mid[aria-selected="true"]{color:#0a4a78}
.screen.night .tabbar button.mid[aria-selected="true"]{color:#9cc6ee}
.aihome{display:flex;align-items:center;gap:12px;width:100%;text-align:start;padding:14px;border-radius:18px;border:0;color:#fff;background:linear-gradient(120deg,#0a4a78,#1d6fb8 70%,#2a8ad6);box-shadow:0 10px 24px -12px rgba(10,74,120,.7);font-family:inherit;position:relative;overflow:hidden}
.aihome::after{content:"";position:absolute;inset:auto -30px -40px auto;width:140px;height:140px;border-radius:50%;background:rgba(255,255,255,.12)}
.aihome .orb{width:46px;height:46px;border-radius:14px;background:rgba(255,255,255,.2);display:grid;place-items:center;flex:none}
.aihome .orb svg{width:24px;height:24px}
.aihome .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.aihome .tx b{font-size:16px;font-weight:800}
.aihome .tx span{font-size:12.5px;opacity:.92;line-height:1.5}
.aihome .mic{width:40px;height:40px;border-radius:50%;background:var(--brand-orange);color:#fff;display:grid;place-items:center;flex:none;box-shadow:0 0 0 4px rgba(255,255,255,.25)}
.home-ind{position:absolute;bottom:6px;left:50%;transform:translateX(-50%);width:120px;height:5px;border-radius:99px;background:var(--p-fg);opacity:.5}
.listrow{display:flex;align-items:center;gap:12px;padding:12px 0}
.listrow + .listrow{border-top:1px solid var(--p-ln)}
.listrow .ic{width:40px;height:40px;border-radius:12px;background:var(--p-sf2);display:grid;place-items:center;color:var(--p-ac);flex:none}
.listrow .tx{flex:1;min-width:0}
.listrow .tx b{display:block;font-weight:700}
.listrow .tx span{font-size:12px;color:var(--p-mu)}
.listrow .chev{color:var(--p-mu)}
.pill-row{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chip-row{display:flex;gap:6px 8px;flex-wrap:wrap}
.chip-row .chip{white-space:nowrap}
.pill-row button{flex:none;padding:6px 12px;border-radius:999px;background:var(--p-sf);border:1px solid var(--p-ln);font-weight:700;font-size:12.5px;color:var(--p-mu);font-family:inherit}
.pill-row button[aria-selected="true"]{background:var(--p-fg);color:var(--p-bg);border-color:var(--p-fg)}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:12.5px;font-weight:700;color:var(--p-mu)}
.field input,.field textarea,.field select{background:var(--p-sf);border:1px solid var(--p-ln);border-radius:12px;padding:11px 12px;font-family:inherit;font-size:15px;color:var(--p-fg);width:100%;min-width:0}
.field textarea{min-height:84px;resize:vertical}
.otp{display:flex;gap:8px;direction:ltr;justify-content:center}
.otp span{width:48px;height:56px;border-radius:12px;border:1.5px solid var(--p-ln);background:var(--p-sf);display:grid;place-items:center;font-size:24px;font-weight:700;font-family:var(--sans)}
.otp span.on{border-color:var(--p-ac)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;direction:ltr}
.pad button{height:58px;border-radius:14px;background:var(--p-sf);border:1px solid var(--p-ln);font-size:22px;font-weight:600;font-family:var(--sans)}
.dots{display:flex;gap:12px;justify-content:center}
.dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--p-ac)}
.dots i.on{background:var(--p-ac)}
.splash{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:30px;text-align:center}
.logo{width:76px;height:76px;border-radius:22px;background:var(--p-ac);display:grid;place-items:center;color:#fff;font-size:34px;font-weight:800}
.kpi{display:grid;grid-template-columns:1fr auto;gap:6px 10px;align-items:center}
.kpi .bar{grid-column:1/-1;height:7px;border-radius:99px;background:var(--p-sf2);overflow:hidden}
.kpi .bar i{display:block;height:100%;background:var(--p-ac);border-radius:99px}
.kpi .bar i.warn{background:var(--warn)}
.kpi .bar i.bad{background:var(--danger)}
.cam{aspect-ratio:3/4;max-height:360px;border-radius:18px;background:#1a1f26;position:relative;overflow:hidden;color:#fff;display:flex;align-items:center;justify-content:center}
.cam .frame{position:absolute;inset:10%;border:2px solid rgba(255,255,255,.7);border-radius:12px}
.cam .frame::before,.cam .frame::after{content:"";position:absolute;width:26px;height:26px;border:3px solid #fff}
.cam .frame::before{top:-3px;left:-3px;border-right:0;border-bottom:0}
.cam .frame::after{bottom:-3px;right:-3px;border-left:0;border-top:0}
.cam .paper{width:62%;height:70%;background:#f2eee4;border-radius:4px;transform:rotate(-3deg);box-shadow:0 10px 30px rgba(0,0,0,.5);color:#333;padding:12px;font-family:var(--sans);font-size:9px;direction:ltr;line-height:1.5}
.cam .paper b{display:block;font-size:11px;border-bottom:1px solid #999;margin-bottom:4px}
.shutter{width:68px;height:68px;border-radius:50%;background:#fff;border:5px solid var(--p-ln);margin:0 auto;box-shadow:0 0 0 3px var(--p-fg) inset}
.ai{border:1px solid var(--p-ln);border-radius:14px;padding:12px;background:var(--p-sf);position:relative}
.ai .tag{font-size:11px;font-weight:800;color:var(--info);display:flex;gap:5px;align-items:center;margin-bottom:6px;letter-spacing:.02em}
.chat{display:flex;flex-direction:column;gap:8px}
.bub{max-width:86%;padding:10px 12px;border-radius:14px;background:var(--p-sf);border:1px solid var(--p-ln);font-size:14px}
.bub.me{align-self:flex-start;background:var(--p-ac);color:#fff;border-color:transparent}
.screen.night .bub.me{color:#06211a}
.bub.ai{align-self:flex-end}
.bub .src{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
.bub .src span{font-size:10.5px;padding:1px 6px;border-radius:5px;background:var(--p-sf2);color:var(--p-mu);font-family:var(--sans)}
.sheet{position:absolute;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;z-index:5;border-radius:34px}
.sheet .in{background:var(--p-sf);width:100%;border-radius:24px 24px 34px 34px;padding:16px 16px 28px;display:flex;flex-direction:column;gap:10px;max-height:85%;overflow:auto}
.sheet .grab{width:44px;height:5px;border-radius:99px;background:var(--p-ln);margin:0 auto 6px}
.opt{display:flex;align-items:center;gap:10px;padding:12px;border-radius:12px;border:1px solid var(--p-ln);font-weight:700;background:var(--p-sf)}
.opt .ic-chev{margin-inline-start:auto;color:var(--p-mu)}
.opt.on{border-color:var(--p-ac);background:var(--p-acs);color:var(--p-ac)}
.toast{position:absolute;left:16px;right:16px;bottom:96px;background:var(--p-fg);color:var(--p-bg);padding:10px 14px;border-radius:12px;font-size:13px;font-weight:700;z-index:6;box-shadow:var(--shadow);display:flex;gap:8px;align-items:center}
.badge-n{min-width:18px;height:18px;border-radius:9px;background:var(--danger);color:#fff;font-size:11px;font-weight:800;display:grid;place-items:center;padding:0 5px;font-family:var(--sans)}
.rank{display:flex;align-items:center;gap:10px;padding:10px 0}
.rank + .rank{border-top:1px solid var(--p-ln)}
.rank .pos{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;font-weight:800;font-family:var(--sans);background:var(--p-sf2)}
.rank.me{background:var(--p-acs);margin:0 -14px;padding:10px 14px;border-radius:12px;border-top:0}
.rank .pos.g{background:#f5c542;color:#4a3200}.rank .pos.s{background:#cfd6de;color:#2b3440}.rank .pos.b{background:#d9a066;color:#3f2300}
.av{width:36px;height:36px;border-radius:50%;background:var(--p-sf2);display:grid;place-items:center;font-weight:800;font-size:13px;color:var(--p-mu);flex:none}
.quiz .opt{font-weight:600}
.quiz .opt.right{border-color:var(--ok);background:var(--ok-soft);color:var(--ok)}
.quiz .opt.wrong{border-color:var(--danger);background:var(--danger-soft);color:var(--danger)}
.cert{border:2px solid var(--p-ac);border-radius:16px;padding:18px;text-align:center;background:var(--p-sf)}
.cert .seal{width:56px;height:56px;border-radius:50%;background:var(--p-acs);color:var(--p-ac);display:grid;place-items:center;margin:0 auto 8px}
.side-notes{width:300px;max-width:100%;display:flex;flex-direction:column;gap:12px}
.note{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:13px}
.note h4{font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.note ul{margin:0;padding-inline-start:18px;display:flex;flex-direction:column;gap:4px}
.note .ids{display:flex;gap:4px;flex-wrap:wrap;margin-top:8px}
.note .ids span{font-size:10.5px;font-family:ui-monospace,Menlo,monospace;padding:1px 6px;border-radius:5px;background:var(--accent-soft);color:var(--accent-ink)}
.note .jump{display:flex;flex-direction:column;gap:4px;margin-top:4px}
.note .jump button{text-align:start;padding:7px 10px;border-radius:8px;border:1px solid var(--line);background:var(--surface-2);font-weight:600;font-size:12.5px;display:flex;align-items:center;gap:6px}
.note .jump button:hover{border-color:var(--accent)}

/* ---------- Web frame ---------- */
.win{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden;min-height:640px;display:flex;flex-direction:column}
.winbar{height:38px;background:var(--surface-2);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;padding:0 12px;flex:none}
.winbar .dots3{display:flex;gap:6px}
.winbar .dots3 i{width:11px;height:11px;border-radius:50%;background:var(--line)}
.winbar .url{flex:1;max-width:460px;margin:0 auto;background:var(--surface);border:1px solid var(--line);border-radius:7px;height:24px;font-size:12px;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:6px;font-family:ui-monospace,Menlo,monospace}
.wapp{display:grid;grid-template-columns:232px 1fr;flex:1;min-height:0}
.wside{background:var(--surface-2);border-inline-end:1px solid var(--line);padding:14px 10px;display:flex;flex-direction:column;gap:4px}
.wside .role{display:grid;grid-template-columns:32px 1fr;gap:4px 10px;align-items:center;padding:10px;border-radius:10px;background:var(--surface);border:1px solid var(--line);margin-bottom:10px}
.wside .role .av{width:32px;height:32px;font-size:12px}
.wside .role b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wside .role span{font-size:11.5px;color:var(--muted)}
.wside .role select{grid-column:1/-1;font-size:12px;border:1px solid var(--line);border-radius:7px;padding:5px 6px;background:var(--surface);width:100%;margin-top:4px}
.wside .grp{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:10px 10px 4px}
.wside .nav{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:9px;font-weight:500;color:var(--fg);text-align:start;width:100%}
.wside .nav:hover{background:var(--surface)}
.wside .nav[aria-current="page"]{background:var(--accent-soft);color:var(--accent-ink);font-weight:600}
.wside .nav .badge-n{margin-inline-start:auto}
.wside .foot{margin-top:auto;padding:10px;font-size:11.5px;color:var(--muted);border-top:1px solid var(--line)}
.wside .foot b{display:block;color:var(--fg);font-weight:600}
.wmain{min-width:0;display:flex;flex-direction:column}
.wtop{display:flex;align-items:center;gap:12px;padding:16px 22px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.wtop h1{font-size:18px;font-weight:700}
.wtop .sub{color:var(--muted);font-size:13px}
.wtop .acts{margin-inline-start:auto;display:flex;gap:8px;flex-wrap:wrap}
.wb{display:inline-flex;align-items:center;gap:7px;padding:7px 12px;border-radius:9px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:13px;color:var(--fg)}
.wb:hover{border-color:var(--muted)}
.wb.pri{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.wb.danger{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 40%,transparent)}
.wb.sm{padding:4px 9px;font-size:12px;border-radius:7px}
.wb:disabled{opacity:.45;cursor:default}
.wbody{padding:20px 22px 28px;display:flex;flex-direction:column;gap:18px;min-width:0}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;min-width:0}
.tile span{font-size:12px;color:var(--muted);display:block;margin-bottom:4px}
.tile b{font-size:24px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;white-space:nowrap}
.tile small{font-size:12px;font-weight:600}
.tile small.up{color:var(--ok)}.tile small.dn{color:var(--danger)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;min-width:0}
.panel > h3{font-size:14px;font-weight:700;padding:12px 16px;border-bottom:1px solid var(--line-soft);display:flex;align-items:center;gap:8px}
.panel > h3 .acts{margin-inline-start:auto;display:flex;gap:6px}
.panel .pad{display:block;padding:14px 16px;direction:ltr}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.three{display:grid;grid-template-columns:2fr 1fr;gap:16px}
.tbl-wrap{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;font-size:13px;min-width:760px}
.tbl th{text-align:start;font-size:11.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--line-soft);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tr[data-go]:hover td{background:var(--surface-2)}
.tbl td .b{font-weight:600;white-space:nowrap}
.tbl td .mu{color:var(--muted);font-size:12px;display:block;white-space:nowrap}
.tbl td.num,.tbl th.num{display:table-cell;white-space:nowrap}
.tbl td.code,.tbl td .code{white-space:nowrap}
.tbl td{line-height:1.4}
.tbl td .av{width:32px;height:32px;font-size:12px}
.tbl .num{font-variant-numeric:tabular-nums}
.tbl tr.late td{background:color-mix(in srgb,var(--danger-soft) 60%,transparent)}
.tag{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:6px;font-size:11.5px;font-weight:600;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.tag.ok{background:var(--ok-soft);color:var(--ok)}.tag.warn{background:var(--warn-soft);color:var(--warn)}.tag.bad{background:var(--danger-soft);color:var(--danger)}.tag.info{background:var(--info-soft);color:var(--info)}.tag.ac{background:var(--accent-soft);color:var(--accent-ink)}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.filters select,.filters input{border:1px solid var(--line);border-radius:8px;padding:6px 9px;background:var(--surface);font-size:13px;min-width:0}
.filters .search{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:8px;padding:0 9px;background:var(--surface)}
.filters .search input{border:0;padding:6px 0;width:180px;max-width:40vw}
.seg-w{display:inline-flex;background:var(--surface-2);padding:3px;border-radius:9px;gap:2px}
.seg-w button{padding:5px 11px;border-radius:7px;font-weight:600;font-size:12.5px;color:var(--muted)}
.seg-w button[aria-selected="true"]{background:var(--surface);color:var(--fg);box-shadow:var(--shadow)}
.bars{display:flex;flex-direction:column;gap:8px;padding:14px 16px}
.bars .r{display:grid;grid-template-columns:minmax(120px,160px) 1fr auto;gap:10px;align-items:center;font-size:13px}
.bars .r .bar{height:10px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bars .r .bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.bars .r .bar i.warn{background:var(--warn)}.bars .r .bar i.bad{background:var(--danger)}
.plist{display:flex;flex-direction:column}
.plist .it{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line-soft);font-size:13px}
.plist .it:last-child{border-bottom:0}
.plist .it .tx{flex:1;min-width:0}
.plist .it .tx b{display:block;font-weight:600}
.plist .it .tx span{color:var(--muted);font-size:12px}
.plist .it[data-go]:hover{background:var(--surface-2)}
.livemap{position:relative;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;overflow:hidden;aspect-ratio:16/9;max-height:420px;width:100%}
.livemap svg{width:100%;height:100%;display:block}
.livemap .sea{fill:color-mix(in srgb,var(--info) 22%,var(--surface-2))}
.livemap .road{fill:none;stroke:var(--line);stroke-width:3;stroke-linecap:round}
.livemap .road.main{stroke:var(--muted);stroke-width:5;opacity:.7}
.livemap .city{font:600 11px var(--sans);fill:var(--muted);paint-order:stroke;stroke:var(--surface);stroke-width:3px;stroke-linejoin:round}
.livemap .pin{cursor:pointer}
.livemap .pin circle.h{fill:var(--accent);stroke:#fff;stroke-width:2}
.livemap .pin.late circle.h{fill:var(--danger)}
.livemap .pin.wait circle.h{fill:var(--warn)}
.livemap .pin text{font:700 10px var(--sans);fill:#fff;text-anchor:middle}
.livemap .pin .lbl{font:600 10.5px var(--sans);fill:var(--fg);text-anchor:start;paint-order:stroke;stroke:var(--surface);stroke-width:3px;stroke-linejoin:round}
.livemap .legend{position:absolute;left:10px;bottom:10px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 9px;font-size:11.5px;display:flex;gap:10px;color:var(--fg);flex-wrap:wrap}
.livemap .legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px;vertical-align:-1px}
.timeline{display:flex;flex-direction:column;gap:0;padding:6px 16px 10px}
.timeline .tl{display:grid;grid-template-columns:22px 1fr auto;gap:10px;padding:8px 0;align-items:start;position:relative}
.timeline .tl + .tl{border-top:1px solid var(--line-soft)}
.timeline .tl .d{width:18px;height:18px;border-radius:50%;border:2px solid var(--line);margin-top:2px}
.timeline .tl.done .d{background:var(--ok);border-color:var(--ok)}
.timeline .tl.cur .d{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.timeline .tl .t{font-weight:600;font-size:13px}
.timeline .tl .m{font-size:12px;color:var(--muted)}
.legs{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;padding:12px 16px}
.leg{border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:12px}
.leg b{display:block;font-size:12.5px;margin-bottom:2px}
.leg .vs{font-variant-numeric:tabular-nums;color:var(--muted)}
.leg.ok{border-color:color-mix(in srgb,var(--ok) 50%,transparent);background:var(--ok-soft)}
.leg.tol{border-color:color-mix(in srgb,var(--warn) 50%,transparent);background:var(--warn-soft)}
.leg.over{border-color:color-mix(in srgb,var(--danger) 50%,transparent);background:var(--danger-soft)}
.leg.wait{opacity:.7;border-style:dashed}
.docs{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px;padding:12px 16px}
.doc{border:1px solid var(--line);border-radius:10px;overflow:hidden;font-size:11.5px}
.doc .th{aspect-ratio:4/3;background:repeating-linear-gradient(45deg,#e7e1d2 0 6px,#efe9da 6px 12px);display:grid;place-items:center;color:#6b5f45}
.doc .cap{padding:6px 8px}
.doc .cap b{display:block;font-weight:600}
.form{display:grid;gap:12px}
.form .f{display:flex;flex-direction:column;gap:4px}
.form label{font-size:12px;font-weight:600;color:var(--muted)}
.form input,.form select,.form textarea{border:1px solid var(--line);border-radius:9px;padding:8px 10px;background:var(--surface);font-size:13px;width:100%;min-width:0}
.form textarea{min-height:70px;resize:vertical}
.form .g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stars{display:inline-flex;gap:3px}
.stars button{width:26px;height:26px;border-radius:6px;display:grid;place-items:center;color:var(--line)}
.stars button.on{color:#f5b301}
.modal{position:fixed;inset:0;background:rgba(10,14,18,.5);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal .box{background:var(--surface);border-radius:14px;border:1px solid var(--line);width:100%;max-width:520px;max-height:90vh;overflow:auto;box-shadow:var(--shadow)}
.modal .box h3{padding:14px 18px;border-bottom:1px solid var(--line);font-size:15px;display:flex;align-items:center}
.modal .box h3 .x{margin-inline-start:auto;color:var(--muted)}
.modal .box .bd{padding:16px 18px;display:flex;flex-direction:column;gap:12px}
.modal .box .ft{padding:12px 18px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}
.wchat{display:flex;flex-direction:column;gap:10px;padding:14px 16px;min-height:260px}
.wmsg{max-width:80%;padding:10px 12px;border-radius:12px;font-size:13px;border:1px solid var(--line);background:var(--surface-2)}
.wmsg.me{align-self:flex-end;background:var(--accent);color:var(--accent-fg);border-color:transparent}
.wmsg table{margin-top:8px;font-size:12px;border-collapse:collapse;min-width:0}
.wmsg td,.wmsg th{padding:3px 8px;border-bottom:1px solid var(--line);text-align:start}
.wmsg .src{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
.wmsg .src span{font-size:10.5px;padding:1px 6px;border-radius:5px;background:var(--surface);color:var(--muted);border:1px solid var(--line)}
.ask{display:flex;gap:8px;padding:10px 16px;border-top:1px solid var(--line-soft)}
.ask input{flex:1;border:1px solid var(--line);border-radius:9px;padding:8px 10px;min-width:0}
.sugg{display:flex;gap:6px;flex-wrap:wrap;padding:0 16px 12px}
.sugg button{font-size:12px;padding:5px 10px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--fg)}
.code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px}
.spark{display:inline-block;vertical-align:middle}
.empty{padding:28px;text-align:center;color:var(--muted);font-size:13px}
.ar{font-family:var(--ar);direction:rtl;unicode-bidi:isolate}
.wtoast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;font-size:13px;z-index:60;box-shadow:var(--shadow);display:flex;gap:8px;align-items:center}
.progress{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent)}
.preview-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.audit .it b{font-family:ui-monospace,Menlo,monospace;font-size:12px}

/* ---------- SRS document ---------- */
.inl{color:var(--accent-ink);font-weight:600;text-decoration:underline}
.srs{display:grid;grid-template-columns:240px minmax(0,1fr);gap:28px;align-items:start}
.srs-toc{position:sticky;top:118px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:1px;max-height:calc(100vh - 140px);overflow:auto}
.toc-h{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:4px 8px 8px}
.toc-i{text-align:start;padding:6px 8px;border-radius:7px;font-size:12.5px;color:var(--fg);line-height:1.3}
.toc-i:hover{background:var(--surface-2)}
.toc-i.l1{font-weight:700;margin-top:4px}
.toc-i.l2{padding-inline-start:16px;color:var(--muted)}
.toc-foot{margin-top:10px;padding:10px 8px 4px;border-top:1px solid var(--line-soft);font-size:11.5px;color:var(--muted);display:flex;flex-direction:column;gap:6px}
.toc-foot a{font-weight:600;color:var(--accent-ink);text-decoration:none;display:inline-flex;gap:6px;align-items:center}
.srs-doc{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:40px 48px 56px;max-width:900px;font-size:14.5px;line-height:1.6;min-width:0}
.srs-doc h2,.srs-doc h3,.srs-doc h4{scroll-margin-top:120px}
.srs-doc h2{font-size:30px;font-weight:700;letter-spacing:-.02em;margin:0 0 6px}
.srs-doc h3{font-size:21px;font-weight:700;margin:40px 0 10px;padding-top:18px;border-top:1px solid var(--line-soft)}
.srs-doc h4{font-size:15.5px;font-weight:700;margin:22px 0 8px;color:var(--accent-ink)}
.srs-doc p{margin:0 0 10px;max-width:72ch}
.srs-doc time,.srs-doc .who{color:var(--muted);font-weight:500}
.srs-doc ul,.srs-doc ol{margin:0 0 12px;padding-inline-start:22px;max-width:72ch}
.srs-doc li{margin:3px 0}
.srs-doc ol.ordered{list-style:none;padding-inline-start:0;counter-reset:srsq}
.srs-doc ol.ordered li{padding-inline-start:26px;position:relative;counter-increment:srsq;margin:5px 0}
.srs-doc ol.ordered li::before{content:counter(srsq) ".";position:absolute;left:0;top:0;color:var(--accent);font-weight:700;font-variant-numeric:tabular-nums}
.srs-doc ul.check{list-style:none;padding-inline-start:0}
.srs-doc ul.check li{padding-inline-start:26px;position:relative}
.srs-doc ul.check li::before{content:"";position:absolute;left:0;top:5px;width:14px;height:14px;border:1.5px solid var(--muted);border-radius:4px}
.srs-doc .tbl-wrap{margin:10px 0 16px;border:1px solid var(--line);border-radius:10px}
.srs-doc table.tbl.doc{min-width:0;width:100%}
.srs-doc .tbl.doc th{background:var(--surface-2);text-transform:none;letter-spacing:0;font-size:12.5px;color:var(--fg)}
.srs-doc .tbl.doc td{vertical-align:top;font-size:13.5px;line-height:1.5}
.srs-doc .tbl.doc td:first-child{white-space:nowrap;font-weight:600}
.srs-doc .formula{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:10px 0 14px;font-size:13.5px}
.fig{margin:14px 0 20px;border:1px solid var(--line);border-radius:12px;padding:16px;background:var(--surface-2)}
.fig figcaption{font-size:12px;color:var(--muted);margin-top:12px;text-align:center}
.dg .bx{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:13px;font-weight:600;min-width:0}
.dg .bx small{display:block;font-weight:500;color:var(--muted);font-size:11.5px;margin-top:2px;line-height:1.35}
.dg .bx.main,.dg .bx.api{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
.dg .bx.end,.dg .bx.ok{border-color:var(--ok);background:var(--ok-soft)}
.dg .bx.warn{border-color:var(--warn);background:var(--warn-soft)}
.dg .bx.src,.dg .bx.app{border-color:var(--info);background:var(--info-soft)}
.dg .bx.ext{border-style:dashed}
.dg .bx.db{background:var(--accent-soft);border-color:var(--accent)}
.dg .bx.note{font-weight:500;font-size:12px;color:var(--muted);background:transparent;border-style:dashed}
.flow-dg{display:grid;grid-template-columns:1fr auto 2fr auto 1fr;gap:12px;align-items:center}
.flow-dg .col{display:flex;flex-direction:column;gap:8px}
.flow-dg .or{text-align:center;font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.flow-dg .arr,.loop i,.steps-dg i{color:var(--muted);font-style:normal;font-size:18px;text-align:center}
.steps-dg{display:flex;flex-wrap:wrap;gap:4px 6px;align-items:center;font-size:12px}
.steps-dg span{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px 9px;font-weight:600}
.flow-dg .loop{grid-column:1/-1;display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding-top:12px;margin-top:4px;border-top:1px dashed var(--line)}
.flow-dg .loop .bx{flex:1 1 160px}
.arch-dg{display:flex;flex-direction:column;gap:8px}
.arch-dg .tier{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.arch-dg .tier-arr{text-align:center;font-size:11.5px;color:var(--muted);font-weight:600;padding:2px 0;position:relative}
.arch-dg .tier-arr::before{content:"↓";margin-inline-end:6px}
.arch-dg .server{border:1.5px dashed var(--accent);border-radius:12px;padding:12px}
.arch-dg .srv-h{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent-ink);font-weight:700;margin-bottom:8px}
.plan-dg{display:flex;flex-direction:column;gap:6px;min-width:0;overflow-x:auto}
.wk-head,.wk-row{display:grid;grid-template-columns:minmax(200px,1.4fr) repeat(8,minmax(44px,1fr));gap:4px;align-items:stretch}
.wk-head span{font-size:11px;color:var(--muted);font-weight:700;text-align:center}
.wk-t{font-size:12.5px;padding:6px 8px 6px 0}
.wk-t b{display:block}
.wk-t small{display:block;color:var(--muted);font-size:11px;line-height:1.35}
.wk-c{border-radius:6px;background:var(--surface);border:1px solid var(--line-soft);min-height:34px;display:grid;place-items:center;font-size:11px;font-weight:800;color:#fff}
.wk-c.build{background:var(--accent);border-color:var(--accent)}
.wk-c.stab{background:var(--info);border-color:var(--info)}
.wk-legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:8px}
.wk-legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-inline-end:5px}
.wk-legend i.build{background:var(--accent)}.wk-legend i.stab{background:var(--info)}
@media (max-width:1000px){ .srs{grid-template-columns:1fr} .srs-toc{position:static;max-height:none} .srs-doc{padding:24px 18px 36px} .flow-dg{grid-template-columns:1fr} .flow-dg .arr{transform:rotate(90deg)}  .three{grid-template-columns:1fr} .map-head{grid-template-columns:1fr} .map-stats{justify-content:flex-start} }
@media (max-width:820px){
  .wapp{grid-template-columns:1fr}
  .wside{flex-direction:row;flex-wrap:wrap;border-inline-end:0;border-bottom:1px solid var(--line);padding:10px;gap:4px;align-items:center}
  .wside .role{margin:0 6px 0 0;flex:1 1 100%;grid-template-columns:32px 1fr auto} .wside .role select{grid-column:auto;width:auto;margin:0}
  .wside .grp{display:none}
  .wside .nav{width:auto;padding:6px 9px;font-size:12.5px}
  .wside .foot{display:none}
  .two,.preview-grid{grid-template-columns:1fr}
  .phone{height:min(760px,calc(100vh - 140px));border-radius:36px;padding:9px}
  .screen{border-radius:28px}
  .side-notes{width:100%}
  .win{min-height:0}
}
@media (max-width:600px){
  .brand small{display:none} .brand{margin-inline-end:0}
  .top-row{gap:8px;min-height:48px}
  .tabs{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;max-width:100%;order:3;flex:1 1 100%}
  .tabs button{padding:6px 10px;font-size:12.5px;white-space:nowrap}
  .top-right{margin-inline-start:auto}
  .toggle span:not(.sw){display:none} .toggle{gap:6px}
  .crumbs{min-height:36px} .crumbs .fr{display:none} .crumbs .path{font-size:12px}
  .stage{padding-block:10px 24px}
  .hint{display:none}
}
@media (max-width:420px){ .phone{padding:0;background:transparent;box-shadow:none;height:calc(100dvh - 165px);min-height:520px;max-height:none} .screen{border-radius:20px;border:1px solid var(--line)} .sbar .notch{display:none} .sheet{border-radius:20px} }
</style>
